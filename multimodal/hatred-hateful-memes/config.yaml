# HatReD: Multi-Domain Hateful Meme Detection
# Based on Hee et al., "Decoding the Underlying Meaning of Multimodal Hateful Memes", IJCAI 2023
# Paper: https://www.ijcai.org/proceedings/2023/0665.pdf
#
# Hateful meme detection requires understanding the interplay between image
# and text. A meme may appear benign when either modality is considered in
# isolation but become hateful when combined. Annotators must consider both
# the visual content and the text overlay together.
#
# Annotation Guidelines:
# 1. View the meme image and read the overlay text together
# 2. Determine if the meme is hateful (attacks a group based on protected attributes)
# 3. If hateful, identify the target group and explain why it is hateful
# 4. Consider that sarcasm, irony, and coded language are common in memes
# 5. A meme can be offensive without being hateful — hateful implies targeting
#    a group based on identity characteristics

annotation_task_name: "HatReD: Hateful Meme Detection"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Classify as hateful or not
  - annotation_type: radio
    name: hateful_classification
    description: "Is this meme hateful? (Attacks a group based on protected characteristics)"
    labels:
      - name: "Hateful"
        tooltip: "The meme attacks, demeans, or incites hatred against a group based on race, religion, gender, sexuality, disability, or other protected characteristics"
        key_value: "h"
      - name: "Not Hateful"
        tooltip: "The meme may be offensive, rude, or distasteful but does not target a protected group with hate"
        key_value: "n"

  # Step 2: Identify target group (if hateful)
  - annotation_type: radio
    name: target_group
    description: "If hateful, which group is primarily targeted?"
    labels:
      - name: "Race / Ethnicity"
        tooltip: "Targets people based on race, ethnicity, or skin color"
      - name: "Religion"
        tooltip: "Targets people based on religious beliefs or affiliation"
      - name: "Gender / Sexuality"
        tooltip: "Targets people based on gender identity, sexual orientation, or sex"
      - name: "Disability"
        tooltip: "Targets people based on physical or mental disability"
      - name: "Nationality / Immigration"
        tooltip: "Targets people based on national origin or immigration status"
      - name: "Political Group"
        tooltip: "Targets people based on political affiliation"
      - name: "Other"
        tooltip: "Targets another group not listed above"
      - name: "N/A (Not Hateful)"
        tooltip: "Select this if the meme is not hateful"

  # Step 3: Explanation
  - annotation_type: text
    name: explanation
    description: "If hateful, briefly explain why this meme is hateful and how the image and text interact to convey hate."

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 3
