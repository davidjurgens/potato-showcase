# MOCHEG: Multimodal Fact-Checking with Explanations
# Based on Yao et al., SIGIR 2023
# Paper: https://dl.acm.org/doi/10.1145/3539618.3591766
#
# Multimodal fact-checking requires verifying claims using evidence from
# multiple modalities (text and images). Annotators must reason across
# both modalities to
# arrive at a verdict.
#
# Annotation Guidelines:
# 1. Read the claim carefully
# 2. Examine ALL evidence: both the text evidence and the image evidence
# 3. Highlight the specific spans in the text evidence that support your verdict
# 4. Assign a verdict: Supported, Refuted, or Not Enough Evidence
# 5. Write a brief explanation justifying your verdict
# 6. Consider whether the image corroborates, contradicts, or is irrelevant
#    to the textual evidence
#
# Verdict Definitions:
# - Supported: The claim is fully supported by the combined evidence
# - Refuted: The evidence directly contradicts the claim
# - Not Enough Evidence: The evidence is insufficient to confirm or deny

annotation_task_name: "MOCHEG: Multimodal Fact-Checking"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Verdict
  - annotation_type: radio
    name: verdict
    description: "Based on the text and image evidence, what is the verdict for this claim?"
    labels:
      - name: "Supported"
        tooltip: "The claim is fully supported by the combined multimodal evidence"
        key_value: "s"
      - name: "Refuted"
        tooltip: "The evidence directly contradicts the claim"
        key_value: "r"
      - name: "Not Enough Evidence"
        tooltip: "The available evidence is insufficient to confirm or deny the claim"
        key_value: "n"

  # Step 2: Highlight relevant evidence spans
  - annotation_type: span
    name: evidence_spans
    description: "Highlight the specific parts of the text evidence that are relevant to your verdict."
    labels:
      - name: "Supporting Evidence"
        tooltip: "Text that directly supports the claim"
        color: "#22c55e"
      - name: "Contradicting Evidence"
        tooltip: "Text that directly contradicts the claim"
        color: "#ef4444"
      - name: "Contextual Information"
        tooltip: "Text that provides useful context but does not directly support or refute"
        color: "#3b82f6"

  # Step 3: Image relevance
  - annotation_type: radio
    name: image_relevance
    description: "How relevant is the image evidence to verifying this claim?"
    labels:
      - name: "Highly relevant - key to verdict"
        tooltip: "The image is essential for determining the verdict"
      - name: "Somewhat relevant - provides additional context"
        tooltip: "The image provides useful but non-essential context"
      - name: "Not relevant - does not help verify the claim"
        tooltip: "The image does not contribute to fact-checking"

  # Step 4: Explanation
  - annotation_type: text
    name: explanation
    description: "Explain your verdict. Describe how the text and image evidence together support your conclusion."

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 3
