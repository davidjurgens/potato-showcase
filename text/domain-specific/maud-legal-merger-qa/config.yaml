# MAUD: Legal Merger Agreement Understanding
# Based on Wang et al., EMNLP 2023
# Paper: https://aclanthology.org/2023.emnlp-main.1009/
# Dataset: https://github.com/TheAtticusProject/maud
#
# Task: Legal document understanding for merger agreements
# Annotators identify key clauses and answer structured questions
# about deal terms in M&A agreements.
#
# Two-step annotation:
# 1. Highlight the relevant clause span(s) answering the question
# 2. Select the structured answer category for the question
#
# Categories cover: Deal Protection, Conditions to Closing,
# Material Adverse Effect, Termination, Representations & Warranties

annotation_task_name: "MAUD: Legal Merger Agreement Understanding"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Identify relevant clause spans
  - annotation_type: span
    name: clause_span
    description: "Highlight the clause or provision that answers the question"
    labels:
      - name: "Deal Protection"
        tooltip: "Provisions protecting the deal (no-shop, matching rights, break-up fees)"
        color: "#3b82f6"
      - name: "Conditions to Closing"
        tooltip: "Conditions that must be satisfied before closing (regulatory approval, shareholder vote)"
        color: "#22c55e"
      - name: "Material Adverse Effect"
        tooltip: "Clauses defining or referencing material adverse effects/changes"
        color: "#ef4444"
      - name: "Termination"
        tooltip: "Provisions related to termination rights, fees, or conditions"
        color: "#f97316"
      - name: "Representations & Warranties"
        tooltip: "Statements of fact about the company (financial, legal, operational)"
        color: "#8b5cf6"
      - name: "Indemnification"
        tooltip: "Provisions for indemnification, liability, or damage recovery"
        color: "#eab308"

  # Step 2: Structured answer to the legal question
  - annotation_type: radio
    name: answer
    description: "Based on the clause, select the answer to the question shown above"
    labels:
      - name: "Yes"
        tooltip: "The agreement clearly and fully addresses the question in the affirmative"
        key_value: "y"
      - name: "No"
        tooltip: "The agreement clearly addresses the question in the negative"
        key_value: "n"
      - name: "Partial / Qualified"
        tooltip: "The agreement addresses the question but with qualifications, exceptions, or limitations"
        key_value: "p"
      - name: "Not Addressed"
        tooltip: "The agreement does not contain a provision addressing this question"
        key_value: "a"
      - name: "Ambiguous"
        tooltip: "The language is unclear or could be interpreted in multiple ways"
        key_value: "b"

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
