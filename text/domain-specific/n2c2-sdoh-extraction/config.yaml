# n2c2 2022 Track 2: Social Determinants of Health Extraction
# Based on Lybarger et al., JAMIA 2023
# Paper: https://academic.oup.com/jamia/article/30/8/1367/7043152
# Dataset: https://portal.dbmi.hms.harvard.edu/projects/n2c2-2022-track2/
#
# Task: Extract SDOH entities and attributes from clinical notes
# Annotators identify mentions of social determinants and classify
# their status attributes.
#
# SDOH Entity Types:
# - Employment: job status, occupation, work-related information
# - LivingStatus: housing, living arrangements, homelessness
# - Alcohol: alcohol use, drinking behaviors
# - Drug: illicit drug use, substance abuse
# - Tobacco: smoking, tobacco/nicotine use
#
# Status Attributes: Current, Past, None, Unknown

annotation_task_name: "n2c2 SDOH Extraction from Clinical Notes"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Identify SDOH entity mentions
  - annotation_type: span
    name: sdoh_entity
    description: "Highlight mentions of social determinants of health in the clinical text"
    labels:
      - name: "Employment"
        tooltip: "Mentions of job status, occupation, work, unemployment, retirement, or disability"
        color: "#22c55e"
      - name: "LivingStatus"
        tooltip: "Mentions of housing situation, living arrangements, homelessness, or shelter"
        color: "#3b82f6"
      - name: "Alcohol"
        tooltip: "Mentions of alcohol consumption, drinking, or alcohol-related behaviors"
        color: "#ef4444"
      - name: "Drug"
        tooltip: "Mentions of illicit drug use, substance abuse, or recreational drug use"
        color: "#f97316"
      - name: "Tobacco"
        tooltip: "Mentions of smoking, tobacco use, vaping, chewing tobacco, or nicotine"
        color: "#eab308"

  # Step 2: Status of the identified SDOH entity
  - annotation_type: radio
    name: entity_status
    description: "What is the current status of the identified SDOH factor?"
    labels:
      - name: "Current"
        tooltip: "The patient currently has this SDOH status (e.g., currently smokes, currently employed)"
        key_value: "c"
      - name: "Past"
        tooltip: "The patient had this status in the past (e.g., former smoker, previously homeless)"
        key_value: "p"
      - name: "None"
        tooltip: "The patient explicitly does not have this status (e.g., denies alcohol, never smoked)"
        key_value: "n"
      - name: "Unknown"
        tooltip: "The status cannot be determined from the available text"
        key_value: "u"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 2
