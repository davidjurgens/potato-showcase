# HateXplain - Explainable Hate Speech Detection
# Based on Mathew et al., AAAI 2021
# Paper: https://ojs.aaai.org/index.php/AAAI/article/view/17745
# Dataset: https://huggingface.co/datasets/hatexplain
#
# Three annotation tasks:
# 1. Classification: hate speech, offensive, or normal
# 2. Target community: which group is targeted (if hate/offensive)
# 3. Rationale spans: which words justify the classification
#
# Guidelines:
# - Hate speech: attacks or demeans a group based on identity
# - Offensive: rude/disrespectful but not targeting identity groups
# - Normal: neither hateful nor offensive
# - Rationale: highlight words that justify your classification (avg 5.5 tokens)

annotation_task_name: "HateXplain: Explainable Hate Speech Detection"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Task 1: Classification
  - annotation_type: radio
    name: classification
    description: "Classify this text as hate speech, offensive, or normal"
    labels:
      - name: Hate Speech
        tooltip: "Content that attacks or demeans a group based on identity attributes (race, religion, gender, etc.)"
        key_value: "h"
      - name: Offensive
        tooltip: "Rude, disrespectful, or profane content that does NOT target identity groups"
        key_value: "o"
      - name: Normal
        tooltip: "Content that is neither hateful nor offensive"
        key_value: "n"

  # Task 2: Target community (only for hate/offensive)
  - annotation_type: multiselect
    name: target_community
    description: "If hate/offensive, select the targeted community/communities"
    labels:
      - name: African
        tooltip: "People of African descent"
      - name: Arab
        tooltip: "People of Arab descent or from Arab countries"
      - name: Asian
        tooltip: "People of Asian descent"
      - name: Caucasian
        tooltip: "People of European/white descent"
      - name: Hispanic
        tooltip: "People of Hispanic/Latino descent"
      - name: Jewish
        tooltip: "Jewish people (ethnic or religious)"
      - name: LGBTQ
        tooltip: "Lesbian, gay, bisexual, transgender, queer individuals"
      - name: Islam
        tooltip: "Muslims or Islamic religion"
      - name: Women
        tooltip: "Women or girls"
      - name: Refugee
        tooltip: "Refugees, immigrants, or asylum seekers"
      - name: Other
        tooltip: "Other identity group not listed"
      - name: None/Not Applicable
        tooltip: "No specific group targeted (for Normal texts)"

  # Task 3: Rationale span annotation
  - annotation_type: span
    name: rationale
    description: "Highlight the words/phrases that justify your classification decision"
    labels:
      - name: Rationale
        tooltip: "Words or phrases that are the reason for classifying as hate/offensive (avg ~5.5 tokens per post)"
        color: "#ef4444"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 3
