# Dynamic Hate Speech Detection
# Based on Vidgen et al., ACL 2021
# Paper: https://aclanthology.org/2021.acl-long.132/
# Dataset: https://github.com/bvidgen/Dynamically-Generated-Hate-Speech-Dataset
#
# This task uses a hierarchical annotation scheme:
# 1. Binary classification: Hate vs Not Hate
# 2. Hate type (if hateful): 5 categories
# 3. Target group identification
#
# Hate Type Definitions:
# - Animosity: Expression of negative feelings, hostility, or opposition
# - Derogation: Insulting, demeaning, or belittling language
# - Dehumanization: Comparing groups to animals, diseases, or subhuman entities
# - Threatening: Direct or implicit threats of violence or harm
# - Support for Hateful Entities: Praising hateful groups, symbols, or ideologies
#
# Annotation Guidelines:
# 1. Consider the overall message and intent
# 2. Slurs alone may not be hateful (reclaimed language, discussion)
# 3. Criticism of ideas/behaviors differs from attacks on identity groups
# 4. Context matters - sarcasm, quotes, and counter-speech should be considered
# 5. When uncertain, consider how a member of the target group would perceive it

annotation_task_name: "Hate Speech Detection"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Binary hate classification
  - annotation_type: radio
    name: is_hateful
    description: "Is this content hateful?"
    labels:
      - name: "Hate"
        tooltip: "Content that attacks, demeans, or threatens individuals or groups based on protected characteristics"
      - name: "Not Hate"
        tooltip: "Content that is not hateful, including legitimate criticism, counter-speech, or neutral discussion"

  # Step 2: Hate type classification (if hateful)
  - annotation_type: radio
    name: hate_type
    description: "What type of hate is expressed? (Select the primary type)"
    labels:
      - name: "Animosity"
        tooltip: "Expression of negative feelings, hostility, antipathy, or opposition toward a group"
      - name: "Derogation"
        tooltip: "Insulting, demeaning, belittling, or degrading language about a group"
      - name: "Dehumanization"
        tooltip: "Comparing a group to animals, vermin, diseases, or subhuman entities"
      - name: "Threatening"
        tooltip: "Direct or implicit threats of violence, harm, or calls for exclusion/extermination"
      - name: "Support for Hateful Entities"
        tooltip: "Praising, supporting, or glorifying hateful groups, symbols, figures, or ideologies"

  # Step 3: Target group identification
  - annotation_type: multiselect
    name: target_groups
    description: "Which groups are targeted? (Select all that apply)"
    labels:
      - name: "Black people"
        color: "#3b82f6"
      - name: "Asian people"
        color: "#06b6d4"
      - name: "Hispanic/Latino people"
        color: "#8b5cf6"
      - name: "Arab/Middle Eastern people"
        color: "#f59e0b"
      - name: "Indigenous people"
        color: "#22c55e"
      - name: "Jewish people"
        color: "#6366f1"
      - name: "Muslims"
        color: "#14b8a6"
      - name: "Women"
        color: "#ec4899"
      - name: "LGBTQ+ people"
        color: "#a855f7"
      - name: "Trans people"
        color: "#d946ef"
      - name: "People with disabilities"
        color: "#f97316"
      - name: "Immigrants/Refugees"
        color: "#0ea5e9"
      - name: "Other group"
        color: "#9ca3af"

  # Step 4: Confidence
  - annotation_type: likert
    name: confidence
    description: "How confident are you in your annotation?"
    labels:
      1: "Very uncertain"
      2: "Somewhat uncertain"
      3: "Moderately confident"
      4: "Confident"
      5: "Very confident"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 3
