# MultiTACRED: Multilingual TAC Relation Extraction
# Based on Hennig et al., ACL 2023
# Paper: https://aclanthology.org/2023.acl-long.210/
# Dataset: https://github.com/DFKI-NLP/MultiTACRED
#
# MultiTACRED extends the English TACRED relation extraction dataset to 12
# languages by machine-translating each instance (DeepL / Google Translate)
# and projecting the subject/object entity annotations; a sample of
# translations was validated by native speakers. It covers 41 TAC relation
# types between subject and object entities.
#
# Translation-target languages (12): Arabic, Chinese, Finnish, French,
# German, Hindi, Hungarian, Japanese, Polish, Russian, Spanish, Turkish
# (English is the original TACRED source, not a translation target.)
#
# Subject Entity Types:
# - PERSON: Named person
# - ORGANIZATION: Named organization
#
# Object Entity Types:
# - PERSON, ORGANIZATION, LOCATION, DATE, NUMBER,
#   TITLE, RELIGION, NATIONALITY, CAUSE_OF_DEATH,
#   CRIMINAL_CHARGE, URL, CITY, STATE_OR_PROVINCE, COUNTRY
#
# TAC Relation Types (41 total), including:
# Person relations: per:origin, per:employee_of, per:spouse,
#   per:children, per:parents, per:siblings, per:title,
#   per:age, per:date_of_birth, per:date_of_death,
#   per:cause_of_death, per:religion, per:schools_attended,
#   per:city_of_birth, per:stateorprovince_of_birth,
#   per:country_of_birth, per:charges
# Organization relations: org:founded, org:founded_by,
#   org:members, org:member_of, org:subsidiaries,
#   org:parents, org:top_members/employees,
#   org:city_of_headquarters, org:country_of_headquarters
#
# Annotation Guidelines:
# 1. Read the sentence and note the language
# 2. Identify subject and object entity spans
# 3. Classify entity types
# 4. Select the TAC relation type for the entity pair
# 5. Assess translation quality if applicable

annotation_task_name: "MultiTACRED: Multilingual Relation Extraction"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Identify subject and object entities
  - annotation_type: span
    name: entities
    description: "Highlight the subject and object entities in the text"
    labels:
      - name: "PERSON"
        tooltip: "Named person (e.g., John Smith, Marie Curie)"
        key_value: "1"
        color: "#3b82f6"
      - name: "ORGANIZATION"
        tooltip: "Named organization (e.g., Google, United Nations)"
        key_value: "2"
        color: "#22c55e"
      - name: "LOCATION"
        tooltip: "General location not covered by city/state/country"
        key_value: "3"
        color: "#ef4444"
      - name: "DATE"
        tooltip: "Dates, years, or time expressions"
        key_value: "4"
        color: "#8b5cf6"
      - name: "NUMBER"
        tooltip: "Numerical values (age, quantity, etc.)"
        color: "#06b6d4"
      - name: "TITLE"
        tooltip: "Job titles, honorifics, or positions"
        color: "#f59e0b"
      - name: "RELIGION"
        tooltip: "Religious denominations or beliefs"
        color: "#ec4899"
      - name: "NATIONALITY"
        tooltip: "National or ethnic identity"
        color: "#14b8a6"
      - name: "CAUSE_OF_DEATH"
        tooltip: "Cause or manner of death"
        color: "#6b7280"
      - name: "CITY"
        tooltip: "City or town names"
        color: "#f97316"
      - name: "STATE_OR_PROVINCE"
        tooltip: "State, province, or regional divisions"
        color: "#a855f7"
      - name: "COUNTRY"
        tooltip: "Country names"
        color: "#dc2626"

  # Step 2: Link entities with TAC relation types
  - annotation_type: span_link
    name: tac_relations
    description: "Draw relations between subject and object entities using TAC relation types"
    link_types:
      - name: "per:origin"
      - name: "per:employee_of"
      - name: "per:spouse"
      - name: "per:children"
      - name: "per:parents"
      - name: "per:siblings"
      - name: "per:title"
      - name: "per:age"
      - name: "per:date_of_birth"
      - name: "per:date_of_death"
      - name: "per:cause_of_death"
      - name: "per:religion"
      - name: "per:schools_attended"
      - name: "per:city_of_birth"
      - name: "per:country_of_birth"
      - name: "per:charges"
      - name: "per:cities_of_residence"
      - name: "per:countries_of_residence"
      - name: "org:founded"
      - name: "org:founded_by"
      - name: "org:members"
      - name: "org:member_of"
      - name: "org:subsidiaries"
      - name: "org:parents"
      - name: "org:top_members/employees"
      - name: "org:city_of_headquarters"
      - name: "org:country_of_headquarters"
      - name: "no_relation"

  # Step 3: Assess translation quality
  - annotation_type: radio
    name: translation_quality
    description: "Rate the quality of the translation (for non-English sentences)"
    labels:
      - name: "Excellent - Natural and accurate"
        tooltip: "Translation reads naturally and preserves all meaning"
        key_value: "q"
      - name: "Good - Minor issues but meaning preserved"
        tooltip: "Small grammatical or stylistic issues; meaning is clear"
        key_value: "w"
      - name: "Acceptable - Some awkwardness but understandable"
        tooltip: "Noticeable issues but core meaning is preserved"
        key_value: "e"
      - name: "Poor - Meaning distorted or unnatural"
        tooltip: "Translation significantly changes meaning or is hard to understand"
        key_value: "r"
      - name: "N/A - Original English text"
        tooltip: "This is the original English text, not a translation"
        key_value: "t"

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
