# Dialogue Relation Extraction (DialogRE)
# Based on Yu et al., ACL 2020
# Paper: https://aclanthology.org/2020.acl-main.444/
# Dataset: https://github.com/nlpdata/dialogre
#
# DialogRE extracts relations between entities mentioned in dialogue.
# Unlike sentence-level RE, dialogue requires understanding:
# - Cross-turn references
# - Pronoun resolution
# - Implicit relationships
#
# 36 Relation Types include:
# Personal: per:spouse, per:children, per:parents, per:siblings
# Professional: per:employee_of, per:title, per:colleagues
# Social: per:friends, per:roommate, per:neighbor
# Other: per:age, per:origin, per:residence, per:schools_attended
#
# Key Challenges:
# - 96% of relations span multiple sentences
# - 66% involve arguments in different turns
# - High pronoun frequency in dialogue
#
# Annotation Guidelines:
# 1. Read the entire dialogue first
# 2. Identify all person and organization entities
# 3. For each entity pair, determine if a relation exists
# 4. Mark supporting text that evidences the relation
# 5. Relations can be inferred, not just explicitly stated

annotation_task_name: "Dialogue Relation Extraction"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "dialogue"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Mark entities
  - annotation_type: span
    name: entities
    description: "Highlight all person and organization entities"
    labels:
      - name: "Person"
        tooltip: "Names of people, including nicknames and references"
        color: "#3b82f6"
      - name: "Organization"
        tooltip: "Companies, institutions, groups"
        color: "#22c55e"

  # Step 2: Relation type
  - annotation_type: radio
    name: relation_type
    description: "What is the relationship between the two most recently marked entities?"
    labels:
      - name: "per:spouse"
        tooltip: "Married or romantic partners"
      - name: "per:children"
        tooltip: "Parent-child relationship (first entity is parent)"
      - name: "per:parents"
        tooltip: "Parent-child relationship (first entity is child)"
      - name: "per:siblings"
        tooltip: "Brothers, sisters"
      - name: "per:friends"
        tooltip: "Friends"
      - name: "per:colleagues"
        tooltip: "Work together"
      - name: "per:employee_of"
        tooltip: "Works for (person-organization)"
      - name: "per:boss"
        tooltip: "Manager/supervisor relationship"
      - name: "per:roommate"
        tooltip: "Live together"
      - name: "per:neighbor"
        tooltip: "Live near each other"
      - name: "per:schools_attended"
        tooltip: "Person attended school/university"
      - name: "Other relation"
        tooltip: "Another type of relationship"
      - name: "No relation"
        tooltip: "No clear relationship between entities"

  # Step 3: Mark evidence
  - annotation_type: span
    name: evidence
    description: "Highlight the text that supports this relation"
    labels:
      - name: "Evidence"
        tooltip: "Text that indicates or proves the relationship"
        color: "#f59e0b"

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
