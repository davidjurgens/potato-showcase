# Social Determinants of Health (SDOH) Extraction
# Based on n2c2 2022 Track 2 / SHAC Corpus
# Paper: https://pubmed.ncbi.nlm.nih.gov/36795066/
# Task: https://n2c2.dbmi.hms.harvard.edu/2022-track-2
#
# Event-based annotation schema:
# - Each SDOH event has a TRIGGER (event type) and ARGUMENTS (attributes)
# - Event types: Alcohol, Drug, Tobacco, Employment, LivingStatus
# - Arguments characterize status, extent, temporality, and type
#
# Example: "Patient quit smoking 5 years ago"
#   Trigger: Tobacco (anchored to "smoking")
#   Arguments: Status=past, StatusTime=past ("quit", "5 years ago")

annotation_task_name: "Social Determinants of Health (SDOH) Extraction"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Identify SDOH event triggers
  - annotation_type: span
    name: sdoh_trigger
    description: "Highlight the trigger word/phrase that indicates an SDOH event"
    labels:
      - name: Alcohol
        tooltip: "Mentions of alcohol use, drinking, or alcohol-related behaviors"
        color: "#ef4444"
      - name: Drug
        tooltip: "Mentions of illicit drug use, substance abuse, or recreational drug use"
        color: "#f97316"
      - name: Tobacco
        tooltip: "Mentions of smoking, tobacco use, vaping, or nicotine"
        color: "#eab308"
      - name: Employment
        tooltip: "Mentions of job status, work, occupation, unemployment, or retirement"
        color: "#22c55e"
      - name: LivingStatus
        tooltip: "Mentions of housing, living situation, homelessness, or living arrangements"
        color: "#3b82f6"

  # Step 2: Status of the SDOH event
  - annotation_type: radio
    name: status
    description: "What is the status of this SDOH factor?"
    labels:
      - name: "current"
        tooltip: "Patient currently has this status (e.g., currently smokes, currently employed)"
        key_value: "c"
      - name: "past"
        tooltip: "Patient had this status in the past (e.g., former smoker, previously unemployed)"
        key_value: "p"
      - name: "none"
        tooltip: "Patient does not have this status (e.g., never smoked, denies alcohol use)"
        key_value: "n"
      - name: "unknown"
        tooltip: "Status cannot be determined from the text"
        key_value: "u"

  # Step 3: Additional arguments for substance use
  - annotation_type: multiselect
    name: substance_attributes
    description: "For substance use events, select applicable attributes"
    labels:
      - name: "Amount mentioned"
        tooltip: "Text specifies quantity (e.g., '2 drinks/day', 'pack of cigarettes')"
      - name: "Frequency mentioned"
        tooltip: "Text specifies how often (e.g., 'daily', 'occasionally', 'weekends')"
      - name: "Duration mentioned"
        tooltip: "Text specifies time period (e.g., '10 years', 'since college')"
      - name: "Type/Method specified"
        tooltip: "Text specifies substance type or method (e.g., 'beer', 'marijuana', 'vaping')"
      - name: "Quit attempt mentioned"
        tooltip: "Text mentions attempt to quit or cessation efforts"

  # Step 4: Living status type (for LivingStatus events)
  - annotation_type: radio
    name: living_type
    description: "For LivingStatus events, what is the living arrangement?"
    labels:
      - name: "alone"
        tooltip: "Patient lives alone"
      - name: "with_family"
        tooltip: "Patient lives with family members (spouse, children, parents)"
      - name: "with_others"
        tooltip: "Patient lives with non-family (roommates, friends)"
      - name: "homeless"
        tooltip: "Patient is homeless, in shelter, or has unstable housing"
      - name: "institution"
        tooltip: "Patient lives in facility (nursing home, assisted living, group home)"
      - name: "not_specified"
        tooltip: "Living arrangement not specified in text"

  # Step 5: Employment type (for Employment events)
  - annotation_type: radio
    name: employment_type
    description: "For Employment events, what is the employment status?"
    labels:
      - name: "employed"
        tooltip: "Patient is currently working"
      - name: "unemployed"
        tooltip: "Patient is not working and seeking employment"
      - name: "retired"
        tooltip: "Patient has retired from work"
      - name: "disabled"
        tooltip: "Patient is unable to work due to disability"
      - name: "student"
        tooltip: "Patient is a student"
      - name: "homemaker"
        tooltip: "Patient works in the home/is a caregiver"
      - name: "not_specified"
        tooltip: "Employment type not specified"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 2
