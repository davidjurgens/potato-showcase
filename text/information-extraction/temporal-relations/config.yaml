# Temporal Relation Annotation
# Based on TimeML/TempEval annotation guidelines
#
# This task involves identifying temporal relations between:
# - Events (actions, states, occurrences)
# - Time expressions (dates, times, durations)
#
# Temporal Relations (TLINK types):
# - BEFORE: Event 1 ends before Event 2 begins
# - AFTER: Event 1 begins after Event 2 ends
# - SIMULTANEOUS: Events occur at the same time
# - INCLUDES: Event 1's timespan contains Event 2
# - IS_INCLUDED: Event 1 is contained within Event 2's timespan
# - VAGUE: Temporal relationship cannot be determined
#
# Annotation Guidelines:
# 1. First identify all events (verbs, nominalizations, states)
# 2. Identify all time expressions (dates, times, durations)
# 3. For each pair of adjacent/related events, determine their temporal relation
# 4. Use VAGUE only when there is genuine ambiguity
# 5. Consider both explicit markers (before, after, then) and implicit ordering
# 6. Pay attention to tense, aspect, and temporal adverbs

annotation_task_name: "Temporal Relation Annotation"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Mark events
  - annotation_type: span
    name: events
    description: "Highlight all events (actions, states, occurrences) in the text"
    labels:
      - name: "Event"
        tooltip: "General action or happening (e.g., 'attacked', 'meeting')"
        color: "#3b82f6"
      - name: "State"
        tooltip: "Ongoing condition or state (e.g., 'is president', 'remained')"
        color: "#22c55e"
      - name: "Reporting"
        tooltip: "Speech or communication act (e.g., 'said', 'announced')"
        color: "#f59e0b"
      - name: "Perception"
        tooltip: "Sensing or perceiving (e.g., 'saw', 'heard', 'felt')"
        color: "#8b5cf6"
      - name: "Aspectual"
        tooltip: "Beginning, continuing, or ending (e.g., 'started', 'continued', 'finished')"
        color: "#06b6d4"
      - name: "Intentional"
        tooltip: "Planning or wanting (e.g., 'planned', 'intended', 'tried')"
        color: "#ec4899"
      - name: "Occurrence"
        tooltip: "Natural or uncontrolled event (e.g., 'earthquake', 'storm')"
        color: "#6366f1"

  # Step 2: Mark time expressions
  - annotation_type: span
    name: time_expressions
    description: "Highlight all time expressions (dates, times, durations)"
    labels:
      - name: "DATE"
        tooltip: "Calendar date (e.g., 'January 15', '2024', 'last Monday')"
        color: "#f97316"
      - name: "TIME"
        tooltip: "Clock time (e.g., '3 PM', 'noon', 'midnight')"
        color: "#eab308"
      - name: "DURATION"
        tooltip: "Length of time (e.g., 'three hours', 'for a week')"
        color: "#84cc16"
      - name: "SET"
        tooltip: "Recurring time (e.g., 'every Monday', 'daily', 'annually')"
        color: "#14b8a6"

  # Step 3: Temporal relation between consecutive events
  - annotation_type: radio
    name: temporal_relation
    description: "What is the temporal relation between the two most recently marked events?"
    labels:
      - name: "BEFORE"
        tooltip: "First event ends before the second event begins"
      - name: "AFTER"
        tooltip: "First event begins after the second event ends"
      - name: "SIMULTANEOUS"
        tooltip: "Events occur at the same time or overlap significantly"
      - name: "INCLUDES"
        tooltip: "First event's timespan fully contains the second event"
      - name: "IS_INCLUDED"
        tooltip: "First event is fully contained within the second event's timespan"
      - name: "VAGUE"
        tooltip: "Temporal relationship cannot be determined from the text"

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
