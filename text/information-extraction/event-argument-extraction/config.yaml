# Event Argument Extraction (MAVEN-Arg style)
# Based on Wang et al., ACL 2024
# Paper: https://aclanthology.org/2024.acl-long.224/
# Dataset: https://github.com/THU-KEG/MAVEN-Argument
#
# MAVEN-Arg provides:
# - 162 event types with expert-written definitions
# - 612 argument roles across all event types
# - Document-level annotation (arguments can be anywhere in document)
# - Both entity and non-entity arguments
#
# This showcase demonstrates a subset of common event types and argument roles.
# Full schema available in the dataset download.
#
# Annotation process:
# 1. Identify event trigger (word/phrase indicating event occurrence)
# 2. Classify event type
# 3. Identify arguments filling semantic roles for that event
# 4. Arguments may be entities (linked) or non-entity spans

annotation_task_name: "Event Argument Extraction"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Event trigger identification and typing
  - annotation_type: span
    name: event_trigger
    description: "Highlight the event trigger and select its event type"
    labels:
      # Life events
      - name: "Life:Birth"
        tooltip: "Birth of a person"
        color: "#22c55e"
      - name: "Life:Death"
        tooltip: "Death of a person (natural, accident, or killing)"
        color: "#6b7280"
      - name: "Life:Injury"
        tooltip: "Physical harm or injury to a person"
        color: "#ef4444"
      # Movement events
      - name: "Movement:Transport"
        tooltip: "Moving objects or goods from one place to another"
        color: "#3b82f6"
      - name: "Movement:Travel"
        tooltip: "Person traveling from one location to another"
        color: "#06b6d4"
      # Conflict events
      - name: "Conflict:Attack"
        tooltip: "Violent physical act causing harm"
        color: "#dc2626"
      - name: "Conflict:Protest"
        tooltip: "Public demonstration or protest"
        color: "#f97316"
      - name: "Conflict:War"
        tooltip: "Armed conflict between groups/nations"
        color: "#991b1b"
      # Transaction events
      - name: "Transaction:Purchase"
        tooltip: "Buying something with money"
        color: "#8b5cf6"
      - name: "Transaction:Sale"
        tooltip: "Selling something for money"
        color: "#a855f7"
      - name: "Transaction:Transfer"
        tooltip: "Transfer of ownership or possession"
        color: "#c084fc"
      # Business events
      - name: "Business:Start"
        tooltip: "Starting a business or organization"
        color: "#14b8a6"
      - name: "Business:End"
        tooltip: "Closing or ending a business"
        color: "#64748b"
      - name: "Business:Merge"
        tooltip: "Combining two or more organizations"
        color: "#0ea5e9"
      # Communication events
      - name: "Communication:Statement"
        tooltip: "Formal statement or declaration"
        color: "#eab308"
      - name: "Communication:Meeting"
        tooltip: "Meeting or gathering of people"
        color: "#facc15"
      - name: "Communication:Announcement"
        tooltip: "Public announcement of information"
        color: "#fde047"
      # Justice events
      - name: "Justice:Arrest"
        tooltip: "Law enforcement taking someone into custody"
        color: "#b91c1c"
      - name: "Justice:Trial"
        tooltip: "Legal court proceeding"
        color: "#7c3aed"
      - name: "Justice:Sentence"
        tooltip: "Legal judgment or sentencing"
        color: "#4c1d95"
      # Personnel events
      - name: "Personnel:Hire"
        tooltip: "Hiring or employing someone"
        color: "#10b981"
      - name: "Personnel:Fire"
        tooltip: "Terminating someone's employment"
        color: "#f43f5e"
      - name: "Personnel:Elect"
        tooltip: "Electing someone to a position"
        color: "#06b6d4"
      # Other
      - name: "Other"
        tooltip: "Event type not covered by above categories"
        color: "#9ca3af"

  # Step 2: Argument identification
  - annotation_type: span
    name: arguments
    description: "Highlight arguments (participants/properties) of the identified events"
    labels:
      # Core arguments
      - name: "Agent"
        tooltip: "Entity performing or causing the event (doer)"
        color: "#3b82f6"
      - name: "Patient"
        tooltip: "Entity affected by or undergoing the event"
        color: "#22c55e"
      - name: "Theme"
        tooltip: "Entity being moved, transferred, or described"
        color: "#8b5cf6"
      # Participants
      - name: "Victim"
        tooltip: "Person harmed in the event"
        color: "#ef4444"
      - name: "Attacker"
        tooltip: "Person/entity causing harm"
        color: "#dc2626"
      - name: "Buyer"
        tooltip: "Entity purchasing something"
        color: "#06b6d4"
      - name: "Seller"
        tooltip: "Entity selling something"
        color: "#0891b2"
      - name: "Giver"
        tooltip: "Entity giving or transferring something"
        color: "#14b8a6"
      - name: "Recipient"
        tooltip: "Entity receiving something"
        color: "#10b981"
      # Circumstantial
      - name: "Location"
        tooltip: "Where the event takes place"
        color: "#f59e0b"
      - name: "Origin"
        tooltip: "Starting point of movement"
        color: "#fbbf24"
      - name: "Destination"
        tooltip: "End point of movement"
        color: "#f97316"
      - name: "Time"
        tooltip: "When the event occurs"
        color: "#a855f7"
      - name: "Duration"
        tooltip: "How long the event lasts"
        color: "#c084fc"
      # Other
      - name: "Instrument"
        tooltip: "Object used to perform the event"
        color: "#6b7280"
      - name: "Cause"
        tooltip: "What caused the event"
        color: "#ec4899"
      - name: "Purpose"
        tooltip: "Goal or intention of the event"
        color: "#db2777"
      - name: "Content"
        tooltip: "What is communicated or expressed"
        color: "#eab308"
      - name: "Value"
        tooltip: "Monetary or quantitative value involved"
        color: "#84cc16"

  # Step 3: Link argument to event
  - annotation_type: radio
    name: argument_event_link
    description: "Which event does the most recently annotated argument belong to? (Enter event number)"
    labels:
      - name: "Event 1"
        tooltip: "Argument belongs to the first event in the text"
      - name: "Event 2"
        tooltip: "Argument belongs to the second event"
      - name: "Event 3"
        tooltip: "Argument belongs to the third event"
      - name: "Event 4"
        tooltip: "Argument belongs to the fourth event"
      - name: "Multiple events"
        tooltip: "Argument is shared across multiple events"

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
