# MediTOD Medical Dialogue Annotation
# Based on Saley et al., EMNLP 2024
# Paper: https://aclanthology.org/2024.emnlp-main.936/
# Dataset: https://github.com/dair-iitd/MediTOD
#
# Task: Annotate medical history-taking dialogues with dialogue acts,
# medical entities, and communication quality assessments.
#
# Guidelines:
# - Label dialogue acts based on the speaker's communicative intent
# - Mark medical entity spans precisely (symptoms, conditions, medications, tests)
# - Assess communication quality dimensions for doctor-patient interaction
# - Use the dialogue context to disambiguate entity types

annotation_task_name: "MediTOD Medical Dialogue Annotation"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Medical entity spans
  - annotation_type: span
    name: medical_entities
    description: "Highlight all medical entities in the dialogue turn"
    labels:
      - name: "Symptom"
        tooltip: "Signs and symptoms reported by patient (e.g., 'chest pain', 'nausea', 'shortness of breath')"
        color: "#f97316"
      - name: "Condition"
        tooltip: "Diagnosed conditions or diseases (e.g., 'diabetes', 'hypertension', 'asthma')"
        color: "#ef4444"
      - name: "Medication"
        tooltip: "Medications, drugs, or treatments mentioned (e.g., 'metformin', 'ibuprofen', 'insulin')"
        color: "#3b82f6"
      - name: "Test"
        tooltip: "Medical tests, procedures, or examinations (e.g., 'blood test', 'X-ray', 'MRI')"
        color: "#8b5cf6"

  # Dialogue act classification
  - annotation_type: radio
    name: dialogue_act
    description: "Select the primary dialogue act for this turn"
    labels:
      - name: "Inform-Symptom"
        tooltip: "Speaker describes a symptom, pain, or physical complaint"
        key_value: "s"
      - name: "Inform-Medical-History"
        tooltip: "Speaker provides past medical history or family history"
        key_value: "h"
      - name: "Inform-Medication"
        tooltip: "Speaker mentions current or past medications"
        key_value: "m"
      - name: "Inform-Lifestyle"
        tooltip: "Speaker describes lifestyle factors (diet, exercise, smoking, alcohol)"
      - name: "Request-Information"
        tooltip: "Speaker asks for medical information or asks about symptoms"
        key_value: "r"
      - name: "Request-Clarification"
        tooltip: "Speaker asks to clarify a previous statement"
        key_value: "c"
      - name: "Confirm"
        tooltip: "Speaker confirms or agrees with a previous statement"
        key_value: "y"
      - name: "Deny"
        tooltip: "Speaker denies or disagrees with a previous statement"
        key_value: "n"
      - name: "Greet"
        tooltip: "Opening greeting or introduction"
      - name: "Farewell"
        tooltip: "Closing or farewell statement"
      - name: "Other"
        tooltip: "Other dialogue acts not covered above"

  # Communication quality dimensions
  - annotation_type: multiselect
    name: communication_quality
    description: "Select all communication quality dimensions demonstrated in this turn (if any)"
    labels:
      - name: "Empathy"
        tooltip: "Speaker shows understanding of the other party's feelings or concerns"
      - name: "Active Listening"
        tooltip: "Speaker reflects back or acknowledges what was said"
      - name: "Clear Explanation"
        tooltip: "Speaker explains medical concepts in understandable terms"
      - name: "Open-ended Questioning"
        tooltip: "Doctor uses open-ended questions to elicit information"
      - name: "Summarization"
        tooltip: "Speaker summarizes key points from the conversation"
      - name: "Patient Education"
        tooltip: "Doctor provides educational information about condition or treatment"
      - name: "Shared Decision Making"
        tooltip: "Doctor involves patient in treatment decisions"
      - name: "None Notable"
        tooltip: "No notable communication quality dimensions in this turn"

  # Free-text notes
  - annotation_type: text
    name: notes
    description: "Optional notes about this annotation (e.g., ambiguous entities, context-dependent interpretation)"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 2
