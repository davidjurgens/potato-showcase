# ArgSciChat Scientific Argumentation Dialogue
# Based on Ruggeri et al., ACL 2023
# Paper: https://aclanthology.org/2023.acl-long.425/
# Dataset: https://github.com/UKPLab/acl2023-argscichat
#
# Task: Annotate argumentative dialogues about scientific papers.
# Label each dialogue turn for argument components and assess
# argument quality dimensions.
#
# Argument Components:
# - Claim: A statement the speaker wants the listener to accept
# - Evidence: Data, findings, or references supporting a claim
# - Rebuttal: A counter-argument challenging a previous claim or evidence
# - Clarification: Requesting or providing clarification on an argument
# - Concession: Acknowledging the validity of a counterpoint
#
# Guidelines:
# - Consider the scientific context when labeling argument components
# - A single turn may contain multiple argument components
# - Evidence should be grounded in the paper or external references
# - Assess quality based on how well arguments are constructed, not agreement

annotation_task_name: "ArgSciChat Scientific Argumentation Annotation"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Argument component type
  - annotation_type: radio
    name: argument_component
    description: "Select the PRIMARY argument component type for this dialogue turn"
    labels:
      - name: "Claim"
        tooltip: "A statement or assertion the speaker wants the listener to accept (e.g., 'This method outperforms the baseline')"
        key_value: "c"
      - name: "Evidence"
        tooltip: "Data, experimental results, citations, or facts supporting or undermining a claim"
        key_value: "e"
      - name: "Rebuttal"
        tooltip: "A counter-argument that challenges a previous claim, evidence, or reasoning"
        key_value: "r"
      - name: "Clarification Request"
        tooltip: "Asking for more details, definitions, or explanation of an argument"
        key_value: "q"
      - name: "Clarification Response"
        tooltip: "Providing additional details or explanation in response to a question"
        key_value: "a"
      - name: "Concession"
        tooltip: "Acknowledging the validity of a counterpoint while potentially maintaining one's position"
        key_value: "o"
      - name: "Question"
        tooltip: "A general question about the paper or topic (not specifically requesting clarification)"
        key_value: "u"
      - name: "Agreement"
        tooltip: "Expressing agreement with a previous claim or argument"
        key_value: "g"
      - name: "Meta-Discussion"
        tooltip: "Discussion about the dialogue process itself, not the scientific content"
      - name: "Other"
        tooltip: "Turns that do not fit the above categories (e.g., greetings, tangents)"

  # Argument quality dimensions (multiselect)
  - annotation_type: multiselect
    name: quality_dimensions
    description: "Select all quality dimensions that are WELL demonstrated in this argument turn"
    labels:
      - name: "Clarity"
        tooltip: "The argument is clearly articulated and easy to understand"
      - name: "Relevance"
        tooltip: "The argument is directly relevant to the paper or topic under discussion"
      - name: "Sufficiency"
        tooltip: "Adequate evidence or reasoning is provided to support the claim"
      - name: "Logical Soundness"
        tooltip: "The reasoning follows logically without fallacies"
      - name: "Specificity"
        tooltip: "The argument references specific methods, results, or sections of the paper"
      - name: "Novelty"
        tooltip: "The argument raises a new point or perspective not previously discussed"
      - name: "Grounded in Paper"
        tooltip: "The argument is directly supported by content from the paper"
      - name: "Acknowledges Limitations"
        tooltip: "The speaker acknowledges limitations or caveats in their argument"
      - name: "None Notable"
        tooltip: "No quality dimensions are particularly well demonstrated"

  # Persuasiveness rating
  - annotation_type: radio
    name: persuasiveness
    description: "How persuasive is this argument turn?"
    labels:
      - name: "Very Persuasive"
        tooltip: "Strong, well-supported argument that would likely convince most readers"
        key_value: "1"
      - name: "Somewhat Persuasive"
        tooltip: "Reasonable argument with some support, moderately convincing"
        key_value: "2"
      - name: "Neutral"
        tooltip: "Neither particularly persuasive nor unpersuasive"
        key_value: "3"
      - name: "Somewhat Unpersuasive"
        tooltip: "Weak argument with limited support or questionable reasoning"
        key_value: "4"
      - name: "Not Persuasive"
        tooltip: "Poorly constructed argument, unsupported, or logically flawed"
        key_value: "5"
      - name: "Not Applicable"
        tooltip: "The turn is not argumentative (e.g., a question or greeting)"
        key_value: "6"

user_config:
  allow_all_users: true
max_annotations_per_user: 150
num_annotators_per_item: 3
