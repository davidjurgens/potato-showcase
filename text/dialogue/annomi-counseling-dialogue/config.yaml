# AnnoMI Counselling Dialogue Annotation
# Based on Wu et al., ICASSP 2022
# Paper: https://ieeexplore.ieee.org/document/9746035
# Dataset: https://github.com/uccollab/AnnoMI
#
# Task: Annotate motivational interviewing counselling dialogues.
# Label therapist utterances for MI behavior codes and client utterances
# for change talk / sustain talk categories.
#
# MI Behavior Codes (Therapist):
# - Open Question: Questions that invite elaboration
# - Closed Question: Questions with limited answer options
# - Simple Reflection: Repeating/rephrasing what client said
# - Complex Reflection: Adding meaning, emphasis, or interpretation
# - Affirmation: Acknowledging client's strengths or efforts
# - Giving Information: Providing educational content
# - Advise with Permission: Offering advice with client's agreement
#
# Change Talk Categories (Client):
# - Change Talk: Statements favoring change (desire, ability, reasons, need, commitment)
# - Sustain Talk: Statements favoring status quo
# - Neutral: Neither change talk nor sustain talk

annotation_task_name: "AnnoMI Counselling Dialogue Annotation"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # MI behavior code (for therapist turns) or change talk type (for client turns)
  - annotation_type: radio
    name: behavior_code
    description: "Select the MI behavior code (therapist) or change talk type (client) for this utterance"
    labels:
      # Therapist codes
      - name: "Open Question"
        tooltip: "Questions that cannot be answered with yes/no and invite the client to elaborate"
        key_value: "o"
      - name: "Closed Question"
        tooltip: "Questions that can be answered with a short response or yes/no"
        key_value: "c"
      - name: "Simple Reflection"
        tooltip: "Repeating or slightly rephrasing what the client has said"
        key_value: "s"
      - name: "Complex Reflection"
        tooltip: "Reflecting with added meaning, emphasis, metaphor, or a new interpretation"
        key_value: "x"
      - name: "Affirmation"
        tooltip: "Statements that recognize client strengths, efforts, or positive behaviors"
        key_value: "a"
      - name: "Giving Information"
        tooltip: "Providing factual or educational information without directing behavior"
      - name: "Advise with Permission"
        tooltip: "Offering suggestions or advice after asking or receiving the client's permission"
      - name: "Confront"
        tooltip: "Directly challenging or arguing against the client (MI non-adherent)"
      - name: "Direct"
        tooltip: "Giving orders, commands, or directing the client without permission (MI non-adherent)"
      # Client codes
      - name: "Change Talk - Desire"
        tooltip: "Client expresses wanting to change ('I wish I could...', 'I want to...')"
        key_value: "d"
      - name: "Change Talk - Ability"
        tooltip: "Client expresses ability to change ('I could...', 'I'm able to...')"
      - name: "Change Talk - Reasons"
        tooltip: "Client provides reasons for change ('It would be better for my health...')"
      - name: "Change Talk - Need"
        tooltip: "Client expresses need to change ('I need to...', 'I have to...')"
      - name: "Change Talk - Commitment"
        tooltip: "Client expresses commitment to change ('I will...', 'I'm going to...')"
        key_value: "k"
      - name: "Sustain Talk"
        tooltip: "Client argues for maintaining the status quo or against change"
        key_value: "u"
      - name: "Neutral/Follow"
        tooltip: "Client provides information or follows along without clear change or sustain talk"
        key_value: "n"

  # MI techniques observed (multiselect)
  - annotation_type: multiselect
    name: techniques
    description: "Select all MI-consistent or MI-inconsistent techniques observed"
    labels:
      - name: "Empathy"
        tooltip: "Speaker demonstrates understanding of the other's perspective"
      - name: "Autonomy Support"
        tooltip: "Therapist supports the client's autonomy and right to choose"
      - name: "Collaboration"
        tooltip: "Therapist works with rather than directing the client"
      - name: "Evocation"
        tooltip: "Therapist draws out the client's own motivations for change"
      - name: "Rolling with Resistance"
        tooltip: "Therapist avoids arguing and reframes resistance"
      - name: "Developing Discrepancy"
        tooltip: "Therapist helps client see gap between current behavior and goals"
      - name: "Normalizing"
        tooltip: "Therapist normalizes the client's experience or ambivalence"
      - name: "Decisional Balance"
        tooltip: "Exploring pros and cons of change and status quo"
      - name: "Elicit-Provide-Elicit"
        tooltip: "Asking what client knows, sharing information, then asking for reaction"
      - name: "Confrontation (MI-inconsistent)"
        tooltip: "Therapist directly confronts or argues with client"
      - name: "Unsolicited Advice (MI-inconsistent)"
        tooltip: "Therapist gives advice without permission"
      - name: "None Notable"
        tooltip: "No specific MI techniques observed in this utterance"

  # Quality rating
  - annotation_type: likert
    name: quality
    description: "Rate the MI quality of this utterance (1=poor MI adherence, 5=excellent MI adherence)"
    size: 5
    min_label: "1 - Poor MI adherence"
    max_label: "5 - Excellent MI adherence"
    labels:
      - "1 - MI non-adherent: confrontational, directive, or dismissive"
      - "2 - Below average: minimal MI skill demonstrated"
      - "3 - Adequate: basic MI skills present but room for improvement"
      - "4 - Good: clear MI-consistent behavior with minor gaps"
      - "5 - Excellent: exemplary MI practice, skillful and empathic"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 2
