# SWBD-DAMSL Dialogue Act Annotation
# Based on Jurafsky et al., 1997
# Manual: https://web.stanford.edu/~jurafsky/ws97/manual.august1.html
# Dataset: https://github.com/CornellNLP/ConvoKit
#
# Key principles:
# - Label based on pragmatic function, not grammatical form
# - Utterances can have both forward and backward functions
# - Context matters for interpretation
# - Default to sd (statement-non-opinion) when uncertain
#
# Forward functions: What the speaker is trying to accomplish
# Backward functions: How the utterance relates to previous turns

annotation_task_name: "SWBD-DAMSL Dialogue Act Annotation"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "utterance"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Primary dialogue act
  - annotation_type: radio
    name: primary_act
    description: "Select the PRIMARY dialogue act for this utterance"
    labels:
      # Statements
      - name: "sd: Statement-non-opinion"
        tooltip: "Descriptive/narrative statements the listener cannot dispute"
        key_value: "s"
      - name: "sv: Statement-opinion"
        tooltip: "Opinions or viewpoints the listener could disagree with"
        key_value: "v"
      # Questions
      - name: "qy: Yes-No-Question"
        tooltip: "Questions expecting yes/no responses"
        key_value: "y"
      - name: "qw: Wh-Question"
        tooltip: "Questions with who, what, where, when, why, how"
        key_value: "w"
      - name: "qo: Open-Question"
        tooltip: "Open-ended questions like 'How about you?'"
      - name: "qr: Or-Question"
        tooltip: "Questions offering alternative choices"
      - name: "^d: Declarative-Question"
        tooltip: "Statement syntax with question intonation/pragmatics"
      - name: "^g: Tag-Question"
        tooltip: "Statements with confirmation-seeking tags"
      - name: "qh: Rhetorical-Question"
        tooltip: "Questions not seeking literal answers"
      # Directives
      - name: "ad: Action-directive"
        tooltip: "Commands, requests, or proposals for action"
      - name: "co: Commit"
        tooltip: "Speaker commits to future action"
      # Conventional
      - name: "fp: Conventional-opening"
        tooltip: "Greetings and opening sequences"
      - name: "fc: Conventional-closing"
        tooltip: "Farewells and closing sequences"
      - name: "ft: Thanking"
        tooltip: "Expressions of gratitude"
      - name: "fa: Apology"
        tooltip: "Apologies for interruptions or errors"
      # Backchannels & Acknowledgments
      - name: "b: Backchannel"
        tooltip: "Continuers: uh-huh, yeah, right, mm-hmm"
        key_value: "b"
      - name: "bk: Acknowledge-answer"
        tooltip: "Acknowledging received answer: 'Oh, okay'"
      - name: "ba: Appreciation"
        tooltip: "Emotional support or positive assessment"
      # Answers
      - name: "ny: Yes-answer"
        tooltip: "Affirmative responses to questions"
        key_value: "1"
      - name: "nn: No-answer"
        tooltip: "Negative responses to questions"
        key_value: "2"
      - name: "no: Other-answer"
        tooltip: "Other answers: 'I don't know', 'Maybe'"
      # Agreement/Disagreement
      - name: "aa: Accept/Agree"
        tooltip: "Agreement with previous statement or proposal"
        key_value: "a"
      - name: "ar: Reject/Disagree"
        tooltip: "Disagreement or rejection"
      - name: "am: Maybe"
        tooltip: "Tentative or partial agreement"
      # Special
      - name: "%: Uninterpretable"
        tooltip: "Unclear or abandoned utterances"
      - name: "x: Non-verbal"
        tooltip: "Laughter, coughs, non-speech sounds"
      - name: "+: Continuation"
        tooltip: "Continues from speaker's own previous turn"

  # Backward functions (optional, for utterances responding to previous turns)
  - annotation_type: multiselect
    name: backward_functions
    description: "Select any BACKWARD functions (how this responds to previous utterance)"
    labels:
      - name: "None"
        tooltip: "No backward-looking function"
      - name: "aa: Accept/Agree"
        tooltip: "Agreement with previous statement"
      - name: "ar: Reject/Disagree"
        tooltip: "Disagreement or rejection"
      - name: "am: Maybe"
        tooltip: "Tentative or partial agreement"
      - name: "b: Backchannel"
        tooltip: "Continuer signal"
      - name: "bk: Acknowledge-answer"
        tooltip: "Acknowledging received answer"
      - name: "ba: Appreciation"
        tooltip: "Emotional support or assessment"
      - name: "ny: Yes-answer"
        tooltip: "Answering yes to a question"
      - name: "nn: No-answer"
        tooltip: "Answering no to a question"

user_config:
  allow_all_users: true
max_annotations_per_user: 300
num_annotators_per_item: 2
