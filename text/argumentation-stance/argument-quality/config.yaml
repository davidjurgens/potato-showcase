# Argument Quality Assessment
# Based on Wachsmuth et al., 2017 taxonomy
# Paper: https://aclanthology.org/2020.coling-main.402/
#
# Three main quality dimensions:
#
# 1. COGENCY (Logic) - Is the reasoning valid?
#    - Local Acceptability: Are premises believable?
#    - Local Relevance: Do premises support the conclusion?
#    - Local Sufficiency: Is there enough support?
#
# 2. EFFECTIVENESS (Rhetoric) - Is it persuasive?
#    - Credibility: Does the author seem trustworthy?
#    - Emotional Appeal: Does it engage emotions appropriately?
#    - Clarity: Is the argument easy to understand?
#
# 3. REASONABLENESS (Dialectic) - Does it contribute to resolution?
#    - Global Acceptability: Are claims defensible?
#    - Global Relevance: Does it address the issue?
#    - Global Sufficiency: Does it adequately resolve the issue?
#
# Note: Correlations with overall quality - Cogency (.84), Effectiveness (.81), Reasonableness (.86)

annotation_task_name: "Argument Quality Assessment"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "argument"

instance_display:
  fields:
    - key: topic
      type: text
      label: "Topic"
    - key: argument
      type: text
      label: "Argument"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Overall Quality Rating
  - annotation_type: radio
    name: overall_quality
    description: "Rate the OVERALL quality of this argument (1=very poor, 5=excellent)"
    labels:
      - name: "1 - Very Poor"
        tooltip: "Fails on most quality dimensions; not convincing at all"
        key_value: "1"
      - name: "2 - Poor"
        tooltip: "Significant weaknesses in logic, persuasion, or relevance"
        key_value: "2"
      - name: "3 - Average"
        tooltip: "Adequate argument with some strengths and weaknesses"
        key_value: "3"
      - name: "4 - Good"
        tooltip: "Strong argument with minor issues"
        key_value: "4"
      - name: "5 - Excellent"
        tooltip: "Highly convincing, well-reasoned, and relevant"
        key_value: "5"

  # Dimension 1: Cogency (Logic)
  - annotation_type: radio
    name: cogency
    description: "COGENCY: Is the argument logically valid? Are the premises acceptable, relevant, and sufficient?"
    labels:
      - name: "1 - Not cogent"
        tooltip: "Premises are false, irrelevant, or completely insufficient"
        key_value: "q"
      - name: "2 - Slightly cogent"
        tooltip: "Major logical flaws; premises barely support conclusion"
        key_value: "w"
      - name: "3 - Moderately cogent"
        tooltip: "Some logical issues but reasoning is followable"
        key_value: "e"
      - name: "4 - Quite cogent"
        tooltip: "Sound reasoning with minor gaps"
        key_value: "r"
      - name: "5 - Very cogent"
        tooltip: "Excellent logic; premises clearly and fully support conclusion"
        key_value: "t"

  # Dimension 2: Effectiveness (Rhetoric)
  - annotation_type: radio
    name: effectiveness
    description: "EFFECTIVENESS: Is the argument persuasive? Does it establish credibility and engage the audience?"
    labels:
      - name: "1 - Not effective"
        tooltip: "Unpersuasive; poor clarity, no credibility, inappropriate tone"
        key_value: "a"
      - name: "2 - Slightly effective"
        tooltip: "Weak persuasive appeal; hard to follow or unconvincing"
        key_value: "s"
      - name: "3 - Moderately effective"
        tooltip: "Somewhat persuasive but could be more compelling"
        key_value: "d"
      - name: "4 - Quite effective"
        tooltip: "Persuasive with good clarity and appropriate appeal"
        key_value: "f"
      - name: "5 - Very effective"
        tooltip: "Highly persuasive; clear, credible, and engaging"
        key_value: "g"

  # Dimension 3: Reasonableness (Dialectic)
  - annotation_type: radio
    name: reasonableness
    description: "REASONABLENESS: Does the argument contribute to resolving the issue? Is it globally relevant and acceptable?"
    labels:
      - name: "1 - Not reasonable"
        tooltip: "Does not address the issue; claims are indefensible"
        key_value: "z"
      - name: "2 - Slightly reasonable"
        tooltip: "Tangential to the issue; weak contribution"
        key_value: "x"
      - name: "3 - Moderately reasonable"
        tooltip: "Addresses the issue but doesn't fully resolve it"
        key_value: "c"
      - name: "4 - Quite reasonable"
        tooltip: "Relevant contribution that advances the discussion"
        key_value: "v"
      - name: "5 - Very reasonable"
        tooltip: "Directly addresses and substantially resolves the issue"
        key_value: "b"

  # Specific quality issues (optional detailed feedback)
  - annotation_type: multiselect
    name: quality_issues
    description: "Select any specific quality issues present in this argument"
    labels:
      - name: "Factual errors"
        tooltip: "Contains false or unverifiable claims"
      - name: "Logical fallacy"
        tooltip: "Contains identifiable reasoning error (e.g., straw man, false dichotomy)"
      - name: "Missing evidence"
        tooltip: "Makes claims without supporting evidence"
      - name: "Unclear reasoning"
        tooltip: "Hard to follow the logical flow"
      - name: "Off-topic"
        tooltip: "Does not address the actual topic/question"
      - name: "Ad hominem attack"
        tooltip: "Attacks person rather than argument"
      - name: "Emotional manipulation"
        tooltip: "Uses fear, anger, or other emotions inappropriately"
      - name: "Overgeneralization"
        tooltip: "Makes sweeping claims from limited evidence"
      - name: "No issues detected"
        tooltip: "No significant quality issues identified"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 3
