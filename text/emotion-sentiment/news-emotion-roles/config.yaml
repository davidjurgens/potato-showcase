# News Headline Emotion Roles (GoodNewsEveryone)
# Based on Bostan et al., LREC 2020
# Paper: https://aclanthology.org/2020.lrec-1.194/
#
# This task annotates emotions in news headlines with semantic roles:
# - Emotion: What emotion is conveyed?
# - Experiencer: Who feels the emotion?
# - Cause: What caused the emotion?
# - Target: What is the emotion directed at?
# - Cue: What words signal the emotion?
#
# Emotion Categories (Extended Plutchik):
# Joy, Sadness, Fear, Anger, Surprise (positive/negative),
# Disgust, Trust, Anticipation (positive/negative),
# Love, Pride, Guilt, Shame, Annoyance
#
# Annotation Guidelines:
# 1. First identify IF there's an emotion in the headline
# 2. Classify the emotion type
# 3. Identify semantic roles (may not all be present)
# 4. Consider both writer's emotion and reader's reaction
# 5. Headlines can evoke emotions even without explicit cues

annotation_task_name: "News Emotion Roles"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "headline"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Emotion classification
  - annotation_type: radio
    name: emotion
    description: "What is the primary emotion in this headline?"
    labels:
      - name: "Joy"
        tooltip: "Happiness, delight, celebration"
      - name: "Sadness"
        tooltip: "Grief, sorrow, disappointment"
      - name: "Fear"
        tooltip: "Anxiety, worry, terror"
      - name: "Anger"
        tooltip: "Frustration, outrage, annoyance"
      - name: "Positive Surprise"
        tooltip: "Pleasant amazement, good news"
      - name: "Negative Surprise"
        tooltip: "Shock, disbelief at bad news"
      - name: "Disgust"
        tooltip: "Revulsion, disapproval"
      - name: "Trust"
        tooltip: "Confidence, faith, security"
      - name: "Positive Anticipation"
        tooltip: "Hope, excitement for future"
      - name: "Negative Anticipation"
        tooltip: "Dread, pessimism"
      - name: "No emotion"
        tooltip: "Neutral, factual headline"

  # Step 2: Emotion intensity
  - annotation_type: likert
    name: intensity
    description: "How intense is the emotion?"
    labels:
      1: "Very weak"
      2: "Weak"
      3: "Moderate"
      4: "Strong"
      5: "Very strong"

  # Step 3: Mark emotion cue
  - annotation_type: span
    name: emotion_cue
    description: "Highlight words that signal the emotion (if any)"
    labels:
      - name: "Emotion Cue"
        tooltip: "Words or phrases that indicate the emotion"
        color: "#ef4444"

  # Step 4: Mark cause
  - annotation_type: span
    name: cause
    description: "Highlight what CAUSED the emotion (if present)"
    labels:
      - name: "Cause"
        tooltip: "The event or entity that caused the emotion"
        color: "#3b82f6"

  # Step 5: Reader vs writer emotion
  - annotation_type: radio
    name: perspective
    description: "Whose emotion is this primarily?"
    labels:
      - name: "Writer/Subject's emotion"
        tooltip: "The emotion of people in the story"
      - name: "Intended reader reaction"
        tooltip: "The emotion the headline is meant to evoke in readers"
      - name: "Both"
        tooltip: "Both writer and reader perspective"
      - name: "Unclear"
        tooltip: "Cannot determine the perspective"

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 3
