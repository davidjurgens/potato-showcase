# RuSentiment - Social Media Sentiment Classification
# Based on Rogers et al., COLING 2018
# Paper: https://aclanthology.org/C18-1064/
# Dataset: https://github.com/text-machine-lab/rusentiment
#
# 5-class sentiment scheme designed for social media:
# - Positive: explicit or implicit positive sentiment
# - Negative: explicit or implicit negative sentiment
# - Neutral: no sentiment expressed
# - Speech Act: formulaic posts (greetings, thanks, congratulations)
# - Skip: unclear, noisy, or user-generated content like poems
#
# Guidelines:
# - Mixed sentiment: annotate based on dominant sentiment
# - Hashtags and emojis are NOT automatic sentiment labels
# - Speech Acts may not reflect sender's actual sentiment
# - Annotation speed target: 250-350 posts per hour

annotation_task_name: "RuSentiment: Social Media Sentiment Classification"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  - annotation_type: radio
    name: sentiment
    description: "Classify the sentiment of this social media post"
    labels:
      - name: Positive
        tooltip: "Post expresses positive emotion or favorable attitude (explicit or implicit)"
        key_value: "1"
      - name: Negative
        tooltip: "Post expresses negative emotion or unfavorable attitude (explicit or implicit)"
        key_value: "2"
      - name: Neutral
        tooltip: "Post contains no sentiment markers; purely informational"
        key_value: "3"
      - name: Speech Act
        tooltip: "Formulaic posts: greetings, thank-yous, congratulations, wishes (may not reflect true sentiment)"
        key_value: "4"
      - name: Skip
        tooltip: "Unclear posts, excessive noise, user-generated content like poems or lyrics"
        key_value: "5"

  # Optional: For mixed sentiment posts
  - annotation_type: radio
    name: mixed_sentiment
    description: "Does this post contain mixed sentiment?"
    labels:
      - name: "No - single sentiment"
        tooltip: "The post expresses only one type of sentiment"
        key_value: "n"
      - name: "Yes - but positive dominant"
        tooltip: "Mixed, but overall more positive"
        key_value: "p"
      - name: "Yes - but negative dominant"
        tooltip: "Mixed, but overall more negative"
        key_value: "g"
      - name: "Yes - balanced/unclear"
        tooltip: "Cannot determine dominant sentiment"
        key_value: "b"

user_config:
  allow_all_users: true
max_annotations_per_user: 500
num_annotators_per_item: 3
