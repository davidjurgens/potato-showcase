# Empathetic Dialogue Annotation
# Based on Rashkin et al., ACL 2019
# Paper: https://aclanthology.org/P19-1534/
# Dataset: https://github.com/facebookresearch/EmpatheticDialogues
#
# This task annotates emotional situations and evaluates empathetic responses.
# The goal is to train conversational agents that respond appropriately to
# users' emotional states.
#
# Emotion Categories (32 situations grouped):
# Positive: Joyful, Excited, Proud, Hopeful, Grateful, Content, Confident, Trusting
# Negative: Sad, Anxious, Angry, Afraid, Disgusted, Guilty, Lonely, Embarrassed
# Surprise: Surprised, Impressed, Curious
# Other: Nostalgic, Sentimental, Anticipating, Jealous, Devastated, Disappointed
#
# Empathy Components:
# - Emotional Reactions: Expressing appropriate emotions in response
# - Interpretations: Showing understanding of the situation
# - Explorations: Asking questions to understand better
#
# Annotation Guidelines:
# 1. Identify the emotional situation the speaker describes
# 2. Evaluate if the response acknowledges the emotion
# 3. Rate the response's empathy level
# 4. Consider: Does the response make the speaker feel heard?

annotation_task_name: "Empathetic Dialogue Annotation"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "dialogue"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Emotional situation classification
  - annotation_type: radio
    name: emotion
    description: "What emotion is the speaker experiencing in this situation?"
    labels:
      # Positive emotions
      - name: "Joyful"
        tooltip: "Feeling happy, delighted, or cheerful"
      - name: "Excited"
        tooltip: "Feeling enthusiastic, eager, or thrilled"
      - name: "Proud"
        tooltip: "Feeling accomplished or pleased with achievements"
      - name: "Grateful"
        tooltip: "Feeling thankful or appreciative"
      - name: "Hopeful"
        tooltip: "Feeling optimistic about the future"
      - name: "Content"
        tooltip: "Feeling satisfied and at peace"
      # Negative emotions
      - name: "Sad"
        tooltip: "Feeling unhappy, sorrowful, or down"
      - name: "Anxious"
        tooltip: "Feeling worried, nervous, or uneasy"
      - name: "Angry"
        tooltip: "Feeling frustrated, irritated, or mad"
      - name: "Afraid"
        tooltip: "Feeling scared, fearful, or terrified"
      - name: "Lonely"
        tooltip: "Feeling isolated, alone, or disconnected"
      - name: "Embarrassed"
        tooltip: "Feeling self-conscious, ashamed, or awkward"
      - name: "Disappointed"
        tooltip: "Feeling let down when expectations weren't met"
      - name: "Devastated"
        tooltip: "Feeling extremely upset or heartbroken"
      # Other
      - name: "Surprised"
        tooltip: "Feeling astonished or caught off guard"
      - name: "Nostalgic"
        tooltip: "Feeling wistful about the past"
      - name: "Jealous"
        tooltip: "Feeling envious of others"

  # Step 2: Empathy rating
  - annotation_type: likert
    name: empathy_level
    description: "How empathetic is the RESPONSE to the speaker's emotional situation?"
    labels:
      1: "Not empathetic"
      2: "Slightly empathetic"
      3: "Moderately empathetic"
      4: "Very empathetic"
      5: "Extremely empathetic"

  # Step 3: Empathy type
  - annotation_type: radio
    name: empathy_type
    description: "What type of empathetic response is this?"
    labels:
      - name: "Emotional Reaction"
        tooltip: "Expresses emotions in response (e.g., 'That's wonderful!' or 'I'm so sorry')"
      - name: "Interpretation"
        tooltip: "Shows understanding of the situation (e.g., 'That must have been hard')"
      - name: "Exploration"
        tooltip: "Asks questions to understand better (e.g., 'What happened next?')"
      - name: "Mixed"
        tooltip: "Combines multiple empathy strategies"
      - name: "Not Empathetic"
        tooltip: "Response doesn't demonstrate empathy"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 3
