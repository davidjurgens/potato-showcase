# Political Discourse Analysis (AgoraSpeech-style)
# Based on Sermpezis et al., arXiv 2025
# Paper: https://arxiv.org/abs/2501.06265
#
# Multi-task annotation covering 6 NLP tasks:
# 1. Sentiment Analysis - emotional tone
# 2. Polarization Detection - divisive language
# 3. Populism Detection - populist rhetoric
# 4. Topic Identification - subject matter
# 5. Named Entity Recognition - persons, organizations, locations
# 6. Text Classification - speech type/category
#
# Designed for political speeches, campaign statements, and public discourse

annotation_task_name: "Political Discourse Analysis"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Task 1: Sentiment Analysis
  - annotation_type: radio
    name: sentiment
    description: "What is the overall emotional tone of this text?"
    labels:
      - name: Positive
        tooltip: "Optimistic, hopeful, praising, or celebratory tone"
        key_value: "1"
      - name: Negative
        tooltip: "Critical, pessimistic, condemning, or fearful tone"
        key_value: "2"
      - name: Neutral
        tooltip: "Balanced, factual, or emotionally detached tone"
        key_value: "3"
      - name: Mixed
        tooltip: "Contains both positive and negative sentiment"
        key_value: "4"

  # Task 2: Polarization Detection
  - annotation_type: radio
    name: polarization
    description: "Does this text contain polarizing or divisive language?"
    labels:
      - name: "Highly polarizing"
        tooltip: "Strong us-vs-them rhetoric, demonization of opponents, inflammatory language"
        key_value: "h"
      - name: "Moderately polarizing"
        tooltip: "Clear partisan framing, criticism of opposing views"
        key_value: "m"
      - name: "Slightly polarizing"
        tooltip: "Some partisan elements but mostly balanced"
        key_value: "s"
      - name: "Not polarizing"
        tooltip: "Neutral, inclusive, or consensus-seeking language"
        key_value: "n"

  # Task 3: Populism Detection
  - annotation_type: multiselect
    name: populism_markers
    description: "Select any populist rhetoric markers present in the text"
    labels:
      - name: "People vs. Elite"
        tooltip: "Framing ordinary people against corrupt/out-of-touch elites"
      - name: "Anti-establishment"
        tooltip: "Criticism of mainstream parties, media, or institutions"
      - name: "Crisis framing"
        tooltip: "Portraying situation as urgent crisis requiring immediate action"
      - name: "Nationalism/Nativism"
        tooltip: "Appeals to national identity, sovereignty, or anti-immigration sentiment"
      - name: "Direct democracy appeal"
        tooltip: "Bypassing institutions, appealing directly to 'the people's will'"
      - name: "Charismatic leadership"
        tooltip: "Positioning speaker as unique voice/savior of the people"
      - name: "None detected"
        tooltip: "No populist rhetoric markers identified"

  # Task 4: Topic Identification
  - annotation_type: multiselect
    name: topics
    description: "What topics are discussed in this text? (select all that apply)"
    labels:
      - name: Economy/Jobs
        tooltip: "Employment, wages, economic growth, business"
      - name: Healthcare
        tooltip: "Health policy, insurance, medical care"
      - name: Immigration
        tooltip: "Immigration policy, borders, refugees"
      - name: Education
        tooltip: "Schools, universities, education policy"
      - name: Environment/Climate
        tooltip: "Climate change, environmental protection, energy"
      - name: Foreign Policy/Security
        tooltip: "International relations, defense, national security"
      - name: Social Issues/Rights
        tooltip: "Civil rights, equality, social justice, family values"
      - name: Corruption/Ethics
        tooltip: "Political corruption, ethics, accountability"
      - name: Infrastructure
        tooltip: "Roads, bridges, public works, broadband"
      - name: Taxes/Budget
        tooltip: "Tax policy, government spending, budget"
      - name: Other
        tooltip: "Topics not covered above"

  # Task 5: Named Entity Recognition
  - annotation_type: span
    name: entities
    description: "Highlight named entities in the text"
    labels:
      - name: Person
        tooltip: "Names of politicians, public figures, or individuals"
        color: "#3b82f6"
      - name: Organization
        tooltip: "Government bodies, companies, NGOs, institutions"
        color: "#22c55e"
      - name: Location
        tooltip: "Countries, cities, regions, places"
        color: "#f59e0b"
      - name: Political Party
        tooltip: "Names of political parties or movements"
        color: "#8b5cf6"
      - name: Event
        tooltip: "Elections, summits, protests, historical events"
        color: "#ec4899"

  # Task 6: Speech Classification
  - annotation_type: radio
    name: speech_type
    description: "What type of political communication is this?"
    labels:
      - name: Campaign speech
        tooltip: "Electoral campaign rally or event speech"
      - name: Policy statement
        tooltip: "Official policy announcement or position paper"
      - name: Parliamentary address
        tooltip: "Speech in legislative body or official chamber"
      - name: Interview/Debate
        tooltip: "Response to questions or debate format"
      - name: Social media post
        tooltip: "Tweet, Facebook post, or similar short-form content"
      - name: Press release
        tooltip: "Official statement to media"
      - name: Other
        tooltip: "Other type of political communication"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 3
