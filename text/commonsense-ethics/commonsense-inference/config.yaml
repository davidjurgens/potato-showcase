# Commonsense Inference (ATOMIC-style)
# Based on ATOMIC (Sap et al., AAAI 2019) and ATOMIC 2020 (Hwang et al.)
# Paper: https://arxiv.org/abs/2010.05953
#
# ATOMIC captures inferential knowledge as if-then relations.
# Given an event, annotators provide commonsense inferences about
# mental states, causes, effects, and attributes.
#
# Inference Dimensions:
# - xIntent: Why did PersonX do this? (motivation/intent)
# - xNeed: What did PersonX need to do before this?
# - xWant: What will PersonX want to do after?
# - xEffect: What effect does this have on PersonX?
# - xReact: How does PersonX feel after?
# - oReact: How do others feel about this?
# - oWant: What will others want to do after?
# - oEffect: What effect does this have on others?
# - xAttr: How would PersonX be described? (attribute)
#
# Annotation Guidelines:
# 1. Read the event carefully
# 2. For each dimension, provide plausible inferences
# 3. "none" is acceptable if no inference applies
# 4. Be specific - "happy" is less useful than "relieved"
# 5. Consider typical/common scenarios, not edge cases
# 6. Multiple valid inferences may exist for each dimension

annotation_task_name: "Commonsense Inference"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "event"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: PersonX's intent
  - annotation_type: radio
    name: xIntent
    description: "Why did PersonX do this? What was their motivation?"
    labels:
      - name: "To be helpful"
        tooltip: "PersonX wanted to help someone or make things easier"
      - name: "To achieve a goal"
        tooltip: "PersonX wanted to accomplish something specific"
      - name: "To express emotions"
        tooltip: "PersonX wanted to show how they feel"
      - name: "To fulfill an obligation"
        tooltip: "PersonX had to do this (duty, promise, expectation)"
      - name: "To satisfy a need"
        tooltip: "PersonX needed something (hunger, comfort, etc.)"
      - name: "For enjoyment"
        tooltip: "PersonX did this for fun or pleasure"
      - name: "Other/unclear"
        tooltip: "The motivation doesn't fit other categories or is unclear"

  # Step 2: PersonX's reaction
  - annotation_type: radio
    name: xReact
    description: "How does PersonX feel as a result of this event?"
    labels:
      - name: "Happy/satisfied"
        tooltip: "PersonX feels good about what happened"
      - name: "Relieved"
        tooltip: "PersonX feels relief that something is done/resolved"
      - name: "Proud"
        tooltip: "PersonX feels accomplished"
      - name: "Anxious/worried"
        tooltip: "PersonX feels nervous or concerned"
      - name: "Tired/exhausted"
        tooltip: "PersonX feels drained of energy"
      - name: "Frustrated"
        tooltip: "PersonX feels annoyed or disappointed"
      - name: "Neutral"
        tooltip: "No strong emotional reaction"

  # Step 3: Others' reaction
  - annotation_type: radio
    name: oReact
    description: "How do OTHER people (not PersonX) feel about this?"
    labels:
      - name: "Grateful/appreciative"
        tooltip: "Others are thankful for what PersonX did"
      - name: "Happy for PersonX"
        tooltip: "Others feel joy on PersonX's behalf"
      - name: "Impressed"
        tooltip: "Others admire what PersonX did"
      - name: "Indifferent"
        tooltip: "Others don't have strong feelings about it"
      - name: "Annoyed"
        tooltip: "Others are bothered by what PersonX did"
      - name: "Concerned"
        tooltip: "Others are worried about PersonX or the situation"
      - name: "Other"
        tooltip: "Other reaction not listed"

  # Step 4: What PersonX wants next
  - annotation_type: radio
    name: xWant
    description: "What will PersonX likely want to do next?"
    labels:
      - name: "Relax/rest"
        tooltip: "PersonX wants to take a break"
      - name: "Continue with related activity"
        tooltip: "PersonX wants to keep doing similar things"
      - name: "Celebrate/reward themselves"
        tooltip: "PersonX wants to enjoy their success"
      - name: "Move on to something else"
        tooltip: "PersonX wants to do something different"
      - name: "Get feedback/validation"
        tooltip: "PersonX wants others' opinions or approval"
      - name: "Fix a problem"
        tooltip: "PersonX needs to address an issue"
      - name: "Nothing specific"
        tooltip: "No clear next desire"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 3
