# Adverse Drug Event Extraction (CADEC-style)
# Based on Karimi et al., J Biomed Inform 2015
# Paper: https://pubmed.ncbi.nlm.nih.gov/25817970/
# Dataset: https://data.csiro.au/collection/csiro:10948
#
# Entity Types:
# - Drug: medication names (brand or generic)
# - ADR (Adverse Drug Reaction): side effects caused by the drug
# - Disease: conditions for which the patient takes medication
# - Symptom: symptoms of a disease leading to medication use
# - Finding: clinical concepts with unclear categorization
#
# Note: CADEC uses colloquial language from patient forums (askapatient.com)
# Annotations are mapped to SNOMED-CT and MedDRA vocabularies

annotation_task_name: "Adverse Drug Event Extraction"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Primary entity annotation
  - annotation_type: span
    name: entities
    description: "Highlight and classify medical entities in the text"
    labels:
      - name: Drug
        tooltip: "Medication name - brand name (e.g., Lipitor) or generic name (e.g., atorvastatin)"
        color: "#3b82f6"
      - name: ADR
        tooltip: "Adverse Drug Reaction - side effect or negative reaction caused by the drug (e.g., 'terrible muscle pain', 'made me dizzy')"
        color: "#ef4444"
      - name: Disease
        tooltip: "Medical condition for which the patient takes the medication (e.g., 'high cholesterol', 'arthritis')"
        color: "#8b5cf6"
      - name: Symptom
        tooltip: "Symptom of the underlying disease, not caused by the drug (e.g., 'joint pain' that led to taking the drug)"
        color: "#f59e0b"
      - name: Finding
        tooltip: "Other clinical concepts that don't clearly fit above categories"
        color: "#6b7280"

  # Severity of ADR (for ADR spans)
  - annotation_type: radio
    name: adr_severity
    description: "If an ADR is present, how severe does the patient describe it?"
    labels:
      - name: Mild
        tooltip: "Minor inconvenience, patient continued medication"
        key_value: "1"
      - name: Moderate
        tooltip: "Significant discomfort, may have affected daily activities"
        key_value: "2"
      - name: Severe
        tooltip: "Serious reaction, patient stopped medication or sought medical help"
        key_value: "3"
      - name: Life-threatening
        tooltip: "Emergency situation, hospitalization, or risk of death"
        key_value: "4"
      - name: Not specified
        tooltip: "Severity not clearly indicated in text"
        key_value: "5"
      - name: N/A (no ADR)
        tooltip: "No adverse drug reaction in this text"
        key_value: "0"

  # Temporal relation to drug
  - annotation_type: radio
    name: temporal_relation
    description: "When did the ADR occur relative to taking the drug?"
    labels:
      - name: "Immediate (within hours)"
        tooltip: "Reaction occurred shortly after taking the medication"
      - name: "Short-term (days to weeks)"
        tooltip: "Reaction developed within days or weeks of starting"
      - name: "Long-term (months)"
        tooltip: "Reaction appeared after prolonged use"
      - name: "After stopping drug"
        tooltip: "Reaction occurred after discontinuing the medication"
      - name: "Not specified"
        tooltip: "Timing not clearly indicated"
      - name: "N/A"
        tooltip: "Not applicable (no ADR present)"

  # Drug-ADR relationship certainty
  - annotation_type: radio
    name: causality_certainty
    description: "How certain is the patient that the drug caused the reaction?"
    labels:
      - name: "Definite"
        tooltip: "Patient explicitly states drug caused the reaction (e.g., 'this drug gave me...')"
        key_value: "d"
      - name: "Probable"
        tooltip: "Strong implication of causation (e.g., 'started having X after taking Y')"
        key_value: "p"
      - name: "Possible"
        tooltip: "Temporal association but causation unclear"
        key_value: "o"
      - name: "Uncertain"
        tooltip: "Patient unsure if drug is responsible"
        key_value: "u"
      - name: "N/A"
        tooltip: "Not applicable (no ADR present)"
        key_value: "n"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 2
