# Clickbait Detection
# Based on clickbait detection research and shared tasks
#
# Clickbait Definition:
# Content designed to attract attention and encourage visitors to click
# on a link, often using sensationalized, misleading, or vague headlines.
#
# Clickbait Characteristics:
# - Curiosity gap: Withholding information to create curiosity
#   ("You won't believe what happened next...")
# - Sensationalism: Exaggerated claims or emotional language
#   ("SHOCKING revelation!", "This will BLOW your mind")
# - Listicles with enticing numbers: "10 things that will change your life"
# - Forward referencing: Using "this" without context
#   ("This one trick...", "This is why...")
# - Misleading framing: Title doesn't match content
# - Emotional manipulation: Triggering outrage, fear, or excitement
#
# Non-Clickbait Characteristics:
# - Informative and specific headlines
# - Accurate representation of content
# - Professional/journalistic tone
# - Complete information provided upfront
#
# Annotation Guidelines:
# 1. Judge the headline/post in isolation (don't consider what article might say)
# 2. Focus on whether it uses manipulative techniques
# 3. A headline can be interesting without being clickbait
# 4. Sponsored content is not automatically clickbait

annotation_task_name: "Clickbait Detection"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "headline"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Binary clickbait classification
  - annotation_type: radio
    name: is_clickbait
    description: "Is this headline clickbait?"
    labels:
      - name: "Clickbait"
        tooltip: "Uses manipulative techniques to bait clicks (curiosity gap, sensationalism, misleading)"
      - name: "Not Clickbait"
        tooltip: "Informative, accurate, and straightforward headline"
      - name: "Borderline"
        tooltip: "Has some clickbait elements but not clearly manipulative"

  # Step 2: Identify clickbait techniques (if clickbait)
  - annotation_type: multiselect
    name: techniques
    description: "Which clickbait techniques are used? (Select all that apply)"
    labels:
      - name: "Curiosity Gap"
        tooltip: "Withholds key information to create curiosity ('You won't believe...', 'What happened next...')"
        color: "#ef4444"
      - name: "Sensationalism"
        tooltip: "Uses shocking or extreme language ('EXPLOSIVE', 'DEVASTATING', 'UNBELIEVABLE')"
        color: "#f97316"
      - name: "Listicle Bait"
        tooltip: "Uses numbered lists to promise valuable content ('10 ways to...', '5 things you must know')"
        color: "#eab308"
      - name: "Forward Reference"
        tooltip: "Uses vague references like 'this', 'here's why', 'the reason' without context"
        color: "#22c55e"
      - name: "Emotional Appeal"
        tooltip: "Tries to trigger strong emotions (fear, outrage, excitement) rather than inform"
        color: "#3b82f6"
      - name: "Exaggeration"
        tooltip: "Overstates importance or impact ('will change your life', 'everyone is talking about')"
        color: "#8b5cf6"
      - name: "Vague/Ambiguous"
        tooltip: "Intentionally unclear to force clicking for basic information"
        color: "#06b6d4"
      - name: "Question Bait"
        tooltip: "Asks provocative questions designed to make readers want the answer"
        color: "#ec4899"

  # Step 3: Confidence rating
  - annotation_type: likert
    name: confidence
    description: "How confident are you in your classification?"
    labels:
      1: "Not confident"
      2: "Slightly confident"
      3: "Moderately confident"
      4: "Confident"
      5: "Very confident"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 3
