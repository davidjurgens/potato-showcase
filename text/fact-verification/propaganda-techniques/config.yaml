# Fine-Grained Propaganda Detection
# Based on Da San Martino et al., EMNLP 2019 and SemEval 2020 Task 11
# Paper: https://aclanthology.org/D19-1565/
# Task: https://propaganda.qcri.org/semeval2020-task11/
#
# 14 propaganda techniques organized by rhetorical dimension:
#
# PATHOS (Appeal to Emotions):
# - Loaded Language: emotionally charged words
# - Name Calling/Labeling: assigning negative labels
# - Exaggeration/Minimisation: amplifying or downplaying
# - Appeal to Fear/Prejudice: creating worry using biases
# - Flag-Waving: exploiting national/group pride
# - Slogans: brief striking phrases
# - Doubt: undermining credibility
#
# LOGOS (Appeal to Logic):
# - Causal Oversimplification: single cause for complex issues
# - Black-and-White Fallacy: false binary choices
# - Thought-terminating Cliches: phrases that stop critical thinking
# - Straw Man/Whataboutism/Red Herring: misrepresentation or deflection
#
# ETHOS (Appeal to Authority):
# - Appeal to Authority: citing experts without evidence
# - Bandwagon/Reductio ad Hitlerum: everyone does it / Hitler did it

annotation_task_name: "Fine-Grained Propaganda Technique Detection"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  - annotation_type: span
    name: propaganda_technique
    description: "Highlight text spans and label them with the propaganda technique used"
    labels:
      # Pathos - Appeal to Emotions
      - name: Loaded Language
        tooltip: "Words with strong emotional connotations to influence the audience (e.g., 'brutal regime', 'freedom fighters')"
        color: "#ef4444"
      - name: Name Calling/Labeling
        tooltip: "Assigning labels that the audience despises or fears (e.g., 'radical', 'extremist')"
        color: "#f97316"
      - name: Exaggeration/Minimisation
        tooltip: "Making something bigger or smaller than reality (e.g., 'the greatest disaster ever')"
        color: "#eab308"
      - name: Appeal to Fear/Prejudice
        tooltip: "Building support by creating anxiety, often leveraging existing biases"
        color: "#84cc16"
      - name: Flag-Waving
        tooltip: "Exploiting patriotism or group pride to promote a position (e.g., 'true Americans believe...')"
        color: "#22c55e"
      - name: Slogans
        tooltip: "Brief, striking phrases that combine labeling with emotional appeal (e.g., 'Make X Great Again')"
        color: "#14b8a6"
      - name: Doubt
        tooltip: "Questioning someone's credibility or character to undermine their argument"
        color: "#06b6d4"
      # Logos - Appeal to Logic
      - name: Causal Oversimplification
        tooltip: "Attributing complex problems to a single cause (e.g., 'immigration is why...')"
        color: "#0ea5e9"
      - name: Black-and-White Fallacy
        tooltip: "Presenting only two choices when more exist (e.g., 'you're either with us or against us')"
        color: "#3b82f6"
      - name: Thought-terminating Cliches
        tooltip: "Phrases that discourage critical thinking (e.g., 'it is what it is')"
        color: "#6366f1"
      - name: Whataboutism/Straw Man/Red Herring
        tooltip: "Deflecting by changing the subject or misrepresenting the opponent's position"
        color: "#8b5cf6"
      # Ethos - Appeal to Authority
      - name: Appeal to Authority
        tooltip: "Claiming truth based on expert endorsement without evidence"
        color: "#a855f7"
      - name: Bandwagon
        tooltip: "Suggesting everyone supports something to pressure agreement (e.g., 'millions of people agree')"
        color: "#d946ef"
      - name: Repetition
        tooltip: "Repeating a message until it becomes accepted through familiarity"
        color: "#ec4899"

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 3
