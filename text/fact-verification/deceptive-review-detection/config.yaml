# Deceptive Review Detection
# Based on Ott et al., ACL 2011
# Paper: https://aclanthology.org/P11-1032/
#
# This task distinguishes truthful reviews (genuine experiences)
# from deceptive reviews (fake, written to mislead).
#
# Key Findings from Research:
# - Humans perform at chance level (50%) at detecting fake reviews
# - Deceptive reviews contain more verbs, adverbs, pronouns
# - Truthful reviews contain more nouns, adjectives, details
# - Fake reviews often set the scene (vacation, business trip)
# - Truthful reviews focus on specific hotel features
#
# Linguistic Patterns:
# Truthful reviews tend to be:
# - More specific about features (room, bathroom, bed)
# - More concrete and detailed
# - More nouns and spatial information
#
# Deceptive reviews tend to:
# - Use more superlatives and exaggeration
# - Focus on why the reviewer was there
# - Be more narrative/story-like
# - Use more first-person pronouns
#
# Annotation Guidelines:
# 1. Read the full review carefully
# 2. Look for specificity vs vagueness
# 3. Consider: Does this feel like lived experience?
# 4. Watch for excessive praise or generic descriptions
# 5. Note: This is difficult - humans struggle at this task

annotation_task_name: "Deceptive Review Detection"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "review"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Authenticity classification
  - annotation_type: radio
    name: authenticity
    description: "Is this review truthful or deceptive?"
    labels:
      - name: "Truthful"
        tooltip: "The review appears to describe a genuine experience"
      - name: "Deceptive"
        tooltip: "The review appears to be fake or fabricated"
      - name: "Uncertain"
        tooltip: "Cannot determine with reasonable confidence"

  # Step 2: Deception indicators (if applicable)
  - annotation_type: multiselect
    name: indicators
    description: "Which indicators influenced your judgment? (Select all that apply)"
    labels:
      - name: "Too generic/vague"
        tooltip: "Could apply to any hotel, lacks specificity"
        color: "#ef4444"
      - name: "Excessive superlatives"
        tooltip: "Too many 'best', 'amazing', 'perfect' claims"
        color: "#f97316"
      - name: "Narrative/story-like"
        tooltip: "Focuses on the story of their trip rather than the hotel"
        color: "#eab308"
      - name: "Lacks specific details"
        tooltip: "No mention of specific rooms, features, or experiences"
        color: "#f59e0b"
      - name: "Focuses on reviewer not product"
        tooltip: "More about why they traveled than the hotel itself"
        color: "#dc2626"
      - name: "Specific concrete details"
        tooltip: "Mentions specific features, room numbers, staff names"
        color: "#22c55e"
      - name: "Mentions negatives honestly"
        tooltip: "Acknowledges some downsides or imperfections"
        color: "#10b981"
      - name: "Balanced perspective"
        tooltip: "Neither overly positive nor negative"
        color: "#14b8a6"

  # Step 3: Confidence
  - annotation_type: likert
    name: confidence
    description: "How confident are you in your classification?"
    labels:
      1: "Just guessing"
      2: "Slightly confident"
      3: "Moderately confident"
      4: "Confident"
      5: "Very confident"

user_config:
  allow_all_users: true
max_annotations_per_user: 100
num_annotators_per_item: 3
