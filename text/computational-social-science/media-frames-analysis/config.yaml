# Media Frames Analysis
# Based on Card et al., ACL 2015
# Paper: https://aclanthology.org/P15-2072/
# Dataset: https://github.com/dallascard/media_frames_corpus
#
# This task asks annotators to identify how news articles frame policy
# issues. Media framing refers to the way information is presented to
# influence how audiences interpret issues. The frame taxonomy covers
# 15 dimensions from Boydstun et al. (2014).
#
# Frame Dimensions:
# - Economic: Costs, benefits, financial impact
# - Capacity and Resources: Availability of resources, infrastructure
# - Morality: Religious, ethical, or moral perspective
# - Fairness and Equality: Equal treatment, discrimination, rights
# - Legality: Legal aspects, constitutionality, court rulings
# - Policy: Specific policies, regulations, legislative proposals
# - Crime and Punishment: Criminal activity, enforcement, penalties
# - Security: National security, public safety, threats
# - Health: Public health, medical, wellness perspectives
# - Quality of Life: Well-being, lifestyle, community impact
# - Cultural Identity: Cultural values, heritage, national identity
# - Public Opinion: Polls, public sentiment, popularity
# - Political: Political strategy, partisanship, elections
# - External Regulation: International bodies, foreign policy, treaties
# - Other: Any coherent group of frames not covered by the categories above
#
# Annotation Guidelines:
# 1. Read the news paragraph and note the topic and source
# 2. Select all applicable framing dimensions
# 3. Choose the single primary (dominant) frame for the article
# 4. Provide a brief justification for your frame selections

annotation_task_name: "Media Frames Analysis"
task_dir: "."

data_files:
  - sample-data.json

item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

port: 8000

annotation_schemes:
  # Step 1: Select applicable framing dimensions
  - annotation_type: multiselect
    name: frame_dimensions
    description: "Which framing dimensions are present in this text? (select all that apply)"
    labels:
      - name: "Economic"
        tooltip: "Discusses costs, benefits, economic impact, or financial considerations"
      - name: "Capacity and Resources"
        tooltip: "Focuses on availability of resources, infrastructure, or logistical capacity"
      - name: "Morality"
        tooltip: "Frames the issue in religious, ethical, or moral terms"
      - name: "Fairness and Equality"
        tooltip: "Discusses equal treatment, discrimination, rights, or justice"
      - name: "Legality"
        tooltip: "Addresses legal aspects, constitutionality, court decisions, or law enforcement"
      - name: "Policy"
        tooltip: "Discusses specific policies, regulations, or legislative proposals"
      - name: "Crime and Punishment"
        tooltip: "Frames the issue around criminal activity, enforcement, or penalties"
      - name: "Security"
        tooltip: "Focuses on national security, public safety, or threats"
      - name: "Health"
        tooltip: "Discusses public health, medical impact, or wellness"
      - name: "Quality of Life"
        tooltip: "Addresses well-being, lifestyle, or community impact"
      - name: "Cultural Identity"
        tooltip: "Discusses cultural values, heritage, or national identity"
      - name: "Public Opinion"
        tooltip: "References polls, public sentiment, or popular support"
      - name: "Political"
        tooltip: "Focuses on political strategy, partisanship, or electoral implications"
      - name: "External Regulation"
        tooltip: "Discusses international bodies, foreign policy, or treaties"
      - name: "Other"
        tooltip: "Any coherent group of frames not covered by the other categories"

  # Step 2: Select the primary (dominant) frame
  - annotation_type: radio
    name: primary_frame
    description: "Which single framing dimension is the primary (dominant) frame of the article?"
    labels:
      - "Economic"
      - "Capacity and Resources"
      - "Morality"
      - "Fairness and Equality"
      - "Legality"
      - "Policy"
      - "Crime and Punishment"
      - "Security"
      - "Health"
      - "Quality of Life"
      - "Cultural Identity"
      - "Public Opinion"
      - "Political"
      - "External Regulation"
      - "Other"

  # Step 3: Provide frame justification
  - annotation_type: text
    name: frame_justification
    description: "Briefly explain why you selected the frame dimensions above"

annotation_instructions: |
  You will be shown paragraphs from news articles about policy issues. Your task is to:
  1. Identify which framing dimensions are present. Multiple frames can co-occur.
  2. Select the single primary (dominant) frame for the article.
  3. Provide a brief justification for your frame selections.

  Media frames shape how readers interpret issues. Look for the underlying perspective
  or emphasis the article uses, not just the topic itself.

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
