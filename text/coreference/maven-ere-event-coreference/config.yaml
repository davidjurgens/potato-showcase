# Event Coreference and Relations (MAVEN-ERE)
# Based on Wang et al., EMNLP 2022
# Paper: https://aclanthology.org/2022.emnlp-main.60/
# Dataset: https://github.com/THU-KEG/MAVEN-ERE
#
# MAVEN-ERE provides unified annotations for four types of event relations:
# - Coreference: Two event mentions refer to the same real-world event
# - Temporal: Ordering between events (before, after, overlap)
# - Causal: One event causes or enables another
# - Subevent: One event is a component of another
#
# Annotation process:
# 1. Identify event mentions (triggers) in the text
# 2. For each pair of events, determine if a relation exists
# 3. Label the relation with its type

annotation_task_name: "MAVEN-ERE Event Coreference and Relations"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  # Step 1: Event mention identification
  - annotation_type: span
    name: event_mentions
    description: "Highlight all event mentions (triggers) in the text. Select the event type for each mention."
    labels:
      - name: "Action"
        tooltip: "Deliberate action performed by an agent (e.g., 'arrested', 'built', 'signed')"
        key_value: "1"
        color: "#3b82f6"
      - name: "State_change"
        tooltip: "Change in state or condition (e.g., 'collapsed', 'increased', 'dissolved')"
        key_value: "2"
        color: "#22c55e"
      - name: "Movement"
        tooltip: "Physical movement or transportation (e.g., 'moved', 'traveled', 'deployed')"
        key_value: "3"
        color: "#f59e0b"
      - name: "Communication"
        tooltip: "Speech, writing, or reporting (e.g., 'announced', 'said', 'published')"
        key_value: "4"
        color: "#8b5cf6"
      - name: "Conflict"
        tooltip: "Violent or adversarial event (e.g., 'attacked', 'protested', 'clashed')"
        key_value: "5"
        color: "#ef4444"
      - name: "Life"
        tooltip: "Birth, death, injury (e.g., 'born', 'died', 'injured')"
        color: "#ec4899"
      - name: "Transaction"
        tooltip: "Exchange or transfer (e.g., 'purchased', 'sold', 'donated')"
        color: "#06b6d4"
      - name: "Natural_disaster"
        tooltip: "Natural event (e.g., 'earthquake', 'flood', 'erupted')"
        color: "#f97316"
      - name: "Creation"
        tooltip: "Making or producing something (e.g., 'created', 'founded', 'invented')"
        color: "#14b8a6"
      - name: "Perception"
        tooltip: "Sensing or observing (e.g., 'detected', 'observed', 'discovered')"
        color: "#a855f7"
      - name: "Other"
        tooltip: "Event type not covered by the above categories"
        color: "#9ca3af"

  # Step 2: Event relation linking
  - annotation_type: span_link
    name: event_relations
    description: "Link pairs of event mentions with their relation type. Select two previously annotated event spans and specify the relation."
    span_schema: event_mentions
    link_types:
      - name: "Coreference"
        color: "#3b82f6"
      - name: "Temporal_before"
        color: "#f59e0b"
      - name: "Temporal_after"
        color: "#f97316"
      - name: "Temporal_overlap"
        color: "#eab308"
      - name: "Causal"
        color: "#ef4444"
      - name: "Subevent"
        color: "#22c55e"

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
