# MathDial - Teacher Move Annotation
# Based on Macina et al., Findings of EMNLP 2023
# Paper: https://aclanthology.org/2023.findings-emnlp.372/
# Dataset: https://github.com/eth-nlped/mathdial
#
# Annotate each tutor utterance with MathDial's four-category teacher-move
# taxonomy, plus supplementary guidance-quality, strategy, and key-span layers.
#
# Teacher Moves (MathDial taxonomy):
# - Focus: guide/narrow the student's attention, seek a strategy, or recall relevant information
# - Probing: ask whether the student understands, seek self-correction, or elicit reasoning/world knowledge
# - Telling: directly reveal the answer or the strategy
# - Generic: greetings, farewells, and other general conversational moves
#
# Supplementary layers below (Potato additions, not part of MathDial):
# Guidance Quality:
# - Correct Guidance: The tutor provides mathematically correct help
# - Incorrect Guidance: The tutor makes a mathematical error
# - Partially Correct: Some correct elements but also errors or omissions
# - Off-topic: The tutor's response does not address the math problem
#
# Tutoring Strategies:
# - Scaffolding: Breaking the problem into smaller, manageable steps
# - Direct Instruction: Explicitly telling the student the answer or method
# - Questioning: Asking questions to guide the student's thinking
# - Encouragement: Positive reinforcement and motivational support
# - Error Correction: Identifying and correcting student mistakes
#
# Guidelines:
# 1. Read the math problem and student level first
# 2. Read the dialogue turn carefully
# 3. Evaluate the mathematical correctness of the tutor's guidance
# 4. Identify all tutoring strategies used in this turn
# 5. Highlight key spans for math concepts, student errors, and tutor strategies

annotation_task_name: "MathDial: Tutoring Dialogue Quality Annotation"
task_dir: "."

data_files:
  - sample-data.json

item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

port: 8000

annotation_schemes:
  # Primary: MathDial four-category teacher-move taxonomy
  - annotation_type: radio
    name: teacher_move
    description: "Which MathDial teacher move does this tutor utterance make?"
    labels:
      - name: "Focus"
        tooltip: "Guide or narrow the student's attention, seek a strategy, or recall relevant information"
        key_value: "1"
      - name: "Probing"
        tooltip: "Ask whether the student understands, seek self-correction, or elicit reasoning/world knowledge"
        key_value: "2"
      - name: "Telling"
        tooltip: "Directly reveal the answer or the strategy"
        key_value: "3"
      - name: "Generic"
        tooltip: "Greetings, farewells, and other general conversational moves"
        key_value: "4"

  # Supplementary (Potato additions, not part of MathDial's taxonomy)
  - annotation_type: radio
    name: guidance_quality
    description: "How correct is the tutor's mathematical guidance in this dialogue turn?"
    labels:
      - name: "Correct Guidance"
        tooltip: "The tutor provides mathematically correct and helpful guidance"
        key_value: "5"
      - name: "Incorrect Guidance"
        tooltip: "The tutor makes a mathematical error or provides wrong information"
        key_value: "6"
      - name: "Partially Correct"
        tooltip: "Some elements are correct but there are errors or important omissions"
        key_value: "7"
      - name: "Off-topic"
        tooltip: "The tutor's response does not address the math problem at hand"
        key_value: "8"

  - annotation_type: multiselect
    name: tutoring_strategies
    description: "Which tutoring strategies are used in this dialogue turn? Select all that apply."
    labels:
      - name: "Scaffolding"
        tooltip: "Breaking the problem into smaller steps to guide the student gradually"
      - name: "Direct Instruction"
        tooltip: "Explicitly telling the student the answer, method, or formula"
      - name: "Questioning"
        tooltip: "Asking questions to prompt the student to think and reason"
      - name: "Encouragement"
        tooltip: "Providing positive reinforcement, praise, or motivational support"
      - name: "Error Correction"
        tooltip: "Identifying a student mistake and correcting it with explanation"

  - annotation_type: span
    name: key_spans
    description: "Highlight key spans in the dialogue turn"
    labels:
      - name: "Math Concept"
        tooltip: "A mathematical concept, formula, term, or operation mentioned"
      - name: "Student Error"
        tooltip: "A mistake or misconception expressed by the student"
      - name: "Tutor Strategy"
        tooltip: "A phrase where the tutor applies a specific pedagogical strategy"

annotation_instructions: |
  You will annotate math tutoring dialogue turns from the MathDial dataset.

  For each item:
  1. Read the math problem and student level context.
  2. Read the tutor's dialogue turn carefully.
  3. Label the teacher move with one of MathDial's four categories (Focus, Probing, Telling, Generic).
  4. Optionally rate guidance quality and select tutoring strategies.
  5. Optionally highlight spans for math concepts, student errors, and tutor strategies.

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
