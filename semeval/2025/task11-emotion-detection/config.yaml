# Text-Based Emotion Detection
# Based on Muhammad et al., SemEval-2025 Task 11: Bridging the Gap in Text-Based Emotion Detection
# Paper: https://aclanthology.org/2025.semeval-1.327/
# Dataset: https://github.com/emotion-analysis-project/SemEval2025-Task11
#
# This task asks annotators to identify the primary emotion expressed
# in a text and to characterize how the emotion is conveyed (explicitly,
# implicitly, sarcastically, or as a mixture of emotions).

annotation_task_name: "Text-Based Emotion Detection"
task_dir: "."

data_files:
  - sample-data.json

item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

port: 8000

annotation_schemes:
  - annotation_type: radio
    name: primary_emotion
    description: "What is the primary emotion expressed in this text?"
    labels:
      - name: "Joy"
        tooltip: "Happiness, delight, excitement, or positive emotion"
        key_value: "1"
      - name: "Sadness"
        tooltip: "Grief, sorrow, melancholy, or loss"
        key_value: "2"
      - name: "Anger"
        tooltip: "Irritation, frustration, rage, or hostility"
        key_value: "3"
      - name: "Fear"
        tooltip: "Anxiety, worry, dread, or apprehension"
        key_value: "4"
      - name: "Surprise"
        tooltip: "Astonishment, shock, or unexpectedness"
        key_value: "5"
      - name: "Disgust"
        tooltip: "Revulsion, contempt, or strong disapproval"
        key_value: "6"
      - name: "Neutral"
        tooltip: "No clear emotion or purely informational"
        key_value: "7"

  - annotation_type: multiselect
    name: expression_type
    description: "How is the emotion expressed? Select all that apply."
    labels:
      - name: "Explicit"
        tooltip: "The emotion is directly stated using emotion words"
      - name: "Implicit"
        tooltip: "The emotion is conveyed indirectly through context or description"
      - name: "Sarcastic"
        tooltip: "The text uses sarcasm or irony to convey emotion"
      - name: "Mixed Emotion"
        tooltip: "Multiple emotions are present simultaneously"

annotation_instructions: |
  You will be shown a text passage. Your task is to:
  1. Read the text carefully.
  2. Identify the primary emotion expressed in the text.
  3. Select how the emotion is expressed (explicit, implicit, sarcastic, or mixed).

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
