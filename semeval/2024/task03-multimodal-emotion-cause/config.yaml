# Multimodal Emotion Cause Analysis
# Based on Wang et al., SemEval 2024
# Paper: https://aclanthology.org/2024.semeval-1.277/
# Dataset: https://github.com/NUSTM/SemEval-2024_ECAC
#
# This task asks annotators to identify emotion expressions and their
# causal utterances within conversational dialogue. Annotators also
# classify the primary emotion of the target utterance.

annotation_task_name: "Multimodal Emotion Cause Analysis"
task_dir: "."

data_files:
  - sample-data.json

item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

port: 8000

annotation_schemes:
  - annotation_type: span
    name: emotion_cause_spans
    description: "Highlight the emotion expression and the utterance that caused it."
    labels:
      - "Emotion Expression"
      - "Cause Utterance"

  - annotation_type: radio
    name: emotion_type
    description: "What is the primary emotion expressed in the target utterance?"
    labels:
      - name: "Happiness"
        tooltip: "Joy, delight, satisfaction, or amusement"
        key_value: "1"
      - name: "Sadness"
        tooltip: "Grief, sorrow, disappointment, or melancholy"
        key_value: "2"
      - name: "Anger"
        tooltip: "Frustration, irritation, rage, or hostility"
        key_value: "3"
      - name: "Surprise"
        tooltip: "Astonishment, shock, or unexpectedness"
        key_value: "4"
      - name: "Disgust"
        tooltip: "Revulsion, contempt, or strong disapproval"
        key_value: "5"
      - name: "Fear"
        tooltip: "Anxiety, worry, dread, or apprehension"
        key_value: "6"
      - name: "Neutral"
        tooltip: "No clear emotional expression"
        key_value: "7"

annotation_instructions: |
  You will be shown a dialogue utterance with its speaker and conversation context. Your task is to:
  1. Read the utterance and surrounding context.
  2. Highlight the span that expresses the emotion and the span that caused it.
  3. Classify the primary emotion in the target utterance.

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
