# Persuasion Techniques in Memes
# Based on Dimitrov et al., SemEval 2024
# Paper: https://aclanthology.org/volumes/2024.semeval-1/
# Dataset: https://github.com/SemEval/semeval-2024-task4
#
# This task asks annotators to identify persuasion and propaganda techniques
# used in meme text, and to highlight the specific text spans where
# persuasive techniques are employed.

annotation_task_name: "Persuasion Techniques in Memes"
task_dir: "."

data_files:
  - sample-data.json

item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

port: 8000

annotation_schemes:
  - annotation_type: multiselect
    name: persuasion_techniques
    description: "Select all persuasion techniques present in the meme."
    labels:
      - name: "Name Calling"
        tooltip: "Labeling the target with a negative term to discredit without evidence"
      - name: "Loaded Language"
        tooltip: "Using emotionally charged words to influence the audience"
      - name: "Appeal to Fear"
        tooltip: "Creating fear to persuade the audience to accept a conclusion"
      - name: "Bandwagon"
        tooltip: "Suggesting everyone is doing it so you should too"
      - name: "Exaggeration"
        tooltip: "Overstating or amplifying claims beyond reason"
      - name: "Black and White"
        tooltip: "Presenting only two options when more exist"
      - name: "Thought-Terminating Cliche"
        tooltip: "Using a common phrase to end critical thinking"
      - name: "Smears"
        tooltip: "Attacking a person's character rather than their argument"
      - name: "Appeal to Authority"
        tooltip: "Using an authority figure to support a claim without evidence"

  - annotation_type: span
    name: persuasion_spans
    description: "Highlight the text spans that contain persuasion techniques."
    labels:
      - "Persuasion Span"

annotation_instructions: |
  You will be shown the text from a meme along with a description of the image. Your task is to:
  1. Read the meme text and image description carefully.
  2. Identify all persuasion or propaganda techniques used.
  3. Highlight the specific text spans where techniques are applied.

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
