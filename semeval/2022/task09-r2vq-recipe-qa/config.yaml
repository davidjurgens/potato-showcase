# R2VQ - Recipe Question Answering
# Based on Tu et al., SemEval-2022 Task 9 (R2VQ)
# Paper: https://aclanthology.org/2022.semeval-1.176/
# Dataset / task site: https://competitions.codalab.org/competitions/34056
#
# This is a simplified adaptation of the R2VQ competence-based QA task.
# It asks annotators to answer questions about recipes and classify the
# answerability of each question relative to the recipe text.
#
# Answerability Labels:
# - Explicitly Stated: The answer is directly written in the recipe
# - Inferable: The answer can be inferred from the recipe context
# - Not Answerable: The recipe does not contain enough information to answer

annotation_task_name: "R2VQ - Recipe Question Answering"
task_dir: "."

data_files:
  - sample-data.json

item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

port: 8000

annotation_schemes:
  - annotation_type: text
    name: answer
    description: "Write the answer to the question based on the recipe"

  - annotation_type: radio
    name: answerability
    description: "How is the answer supported by the recipe text?"
    labels:
      - name: "Explicitly Stated"
        tooltip: "The answer is directly and clearly stated in the recipe text"
        key_value: "1"
      - name: "Inferable"
        tooltip: "The answer can be reasonably inferred from the recipe context but is not explicitly stated"
        key_value: "2"
      - name: "Not Answerable"
        tooltip: "The recipe does not contain enough information to answer this question"
        key_value: "3"

annotation_instructions: |
  You will see a recipe and a question about it.
  1. Read the recipe text carefully.
  2. Answer the question based on the recipe.
  3. Classify whether the answer is explicitly stated in the recipe, can be inferred, or cannot be answered.

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
