# Multilingual Emoji Prediction
# Based on Barbieri et al., SemEval 2018
# Paper: https://aclanthology.org/S18-1003/
# Dataset: https://competitions.codalab.org/competitions/17344
#
# This task asks annotators to predict the most appropriate emoji for a
# given tweet from a set of 20 most frequent emojis on Twitter.
#
# The 20 emoji categories represent the most commonly used emojis,
# described by their textual names for accessibility.

annotation_task_name: "Multilingual Emoji Prediction"
task_dir: "."

data_files:
  - sample-data.json

item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

port: 8000

annotation_schemes:
  - annotation_type: radio
    name: emoji_prediction
    description: "Which emoji best matches this tweet?"
    labels:
      - name: "Heart"
        tooltip: "Red heart - love, affection, strong positive emotion"
      - name: "Face Laughing"
        tooltip: "Laughing face with tears - something very funny"
      - name: "Heart Eyes"
        tooltip: "Heart-eyes face - adoration, infatuation"
      - name: "Fire"
        tooltip: "Fire - something hot, trending, excellent"
      - name: "Smiling"
        tooltip: "Smiling face - general happiness or friendliness"
      - name: "Crying"
        tooltip: "Crying face - sadness or being deeply moved"
      - name: "Two Hearts"
        tooltip: "Two hearts - mutual love, romance"
      - name: "Kiss"
        tooltip: "Kiss mark - sending a kiss, affection"
      - name: "Folded Hands"
        tooltip: "Folded hands - please, thank you, prayer"
      - name: "Clapping"
        tooltip: "Clapping hands - applause, congratulations"
      - name: "OK"
        tooltip: "OK hand - approval, agreement"
      - name: "Sparkles"
        tooltip: "Sparkles - something special, magical, or new"
      - name: "Flexed Biceps"
        tooltip: "Flexed biceps - strength, effort, working hard"
      - name: "Camera"
        tooltip: "Camera - photography, capturing moments"
      - name: "Sunglasses"
        tooltip: "Sunglasses face - cool, confident"
      - name: "Blue Heart"
        tooltip: "Blue heart - trust, loyalty, platonic love"
      - name: "Musical Notes"
        tooltip: "Musical notes - music, singing, rhythm"
      - name: "Smirking"
        tooltip: "Smirking face - sly, suggestive, flirty"
      - name: "Sun"
        tooltip: "Sun - sunny day, brightness, warmth"
      - name: "Purple Heart"
        tooltip: "Purple heart - compassion, support, honor"

annotation_instructions: |
  You will be shown a tweet with the emoji removed. Your task is to predict
  which of the 20 most common emojis was originally used with this tweet.
  Consider the tone, topic, and sentiment of the tweet.

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
