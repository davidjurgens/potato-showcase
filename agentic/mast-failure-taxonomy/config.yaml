# MAST Failure Taxonomy
# Based on "Why Do Multi-Agent LLM Systems Fail?" (Cemri et al., arXiv 2025)
# Task: Classify failure modes in multi-agent LLM system traces using the MAST taxonomy

annotation_task_name: "MAST Failure Taxonomy"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  - name: failure_modes
    description: "Select all failure modes from the MAST taxonomy that apply to this trace. Modes are grouped into three categories: (1) Specification & System Design, (2) Inter-Agent Misalignment, (3) Task Verification."
    annotation_type: multiselect
    labels:
      - "1.1 Disobey Task Specification"
      - "1.2 Disobey Role Specification"
      - "1.3 Step Repetition"
      - "1.4 Loss of Conversation History"
      - "1.5 Unaware of Termination Conditions"
      - "2.1 Conversation Reset"
      - "2.2 Fail to Ask for Clarification"
      - "2.3 Task Derailment"
      - "2.4 Information Withholding"
      - "2.5 Ignored Other Agent's Input"
      - "2.6 Reasoning-Action Mismatch"
      - "3.1 Premature Termination"
      - "3.2 No or Incomplete Verification"
      - "3.3 Incorrect Verification"
      - "No Failure Detected"

  - name: severity
    description: "How severe is the overall failure in this trace?"
    annotation_type: radio
    labels:
      - name: "Critical"
        key_value: "1"
      - name: "Major"
        key_value: "2"
      - name: "Minor"
        key_value: "3"
      - name: "None"
        key_value: "4"

  - name: first_failure_step
    description: "At which step did the first failure occur?"
    annotation_type: radio
    labels:
      - "Step 1"
      - "Step 2"
      - "Step 3"
      - "Step 4"
      - "Step 5"
      - "Step 6"
      - "No Failure"

  - name: failure_description
    description: "Explain the failure: what went wrong, why, and how it affected the outcome."
    annotation_type: text

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
