# TrajEval Staged Evaluation
# Based on the TRAJEVAL framework from "Coherence Collapse: Diagnosing Why Code Agents Fail After Reaching the Right Code" (Kim et al., arXiv:2603.24631, 2026)
# Task: Evaluate code agent trajectories by scoring decomposed stages (search, edit, verification)

annotation_task_name: "TrajEval Staged Evaluation"
task_dir: "."

data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  - annotation_type: multirate
    name: stage_scores
    description: "Rate each dimension of the agent's trajectory quality on a 5-point scale."
    labels:
      - "1 - Very Poor"
      - "2 - Poor"
      - "3 - Average"
      - "4 - Good"
      - "5 - Excellent"
    options:
      - "Search Quality"
      - "Read Comprehension"
      - "Edit Correctness"
      - "Verification Thoroughness"
      - "Overall Efficiency"

  - name: overall_verdict
    description: "What is the overall verdict for this code agent trajectory?"
    annotation_type: radio
    labels:
      - name: "Pass"
        key_value: "1"
      - name: "Marginal Pass"
        key_value: "2"
      - name: "Fail"
        key_value: "3"

  - name: stage_justification
    description: "Justify which stage had the most impact on the outcome (positive or negative)."
    annotation_type: text

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
