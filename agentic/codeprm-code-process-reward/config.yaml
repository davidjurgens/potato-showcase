# CodePRM Code Process Reward
# Based on "CodePRM: Execution Feedback-enhanced Process Reward Model for Code Generation" (Li et al., ACL 2025 Findings)

annotation_task_name: "CodePRM Code Process Reward"
task_dir: "."
data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  - name: "step_correctness"
    annotation_type: radio
    description: "Verify each code generation step against the problem requirements."
    labels:
      - name: "Correct — code step is valid"
        key_value: "1"
      - name: "Neutral — step doesn't affect outcome"
        key_value: "2"
      - name: "Incorrect — step introduces a bug"
        key_value: "3"

  - name: "code_compiles"
    annotation_type: radio
    description: "Is the code in this step syntactically valid?"
    labels:
      - name: "Yes — code is syntactically valid"
        key_value: "4"
      - name: "No — syntax error present"
        key_value: "5"
      - name: "N/A — not a code step"
        key_value: "6"

  - name: "step_feedback"
    annotation_type: text
    description: "Provide feedback on the current step."

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
