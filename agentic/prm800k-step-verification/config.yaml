# PRM800K Step-by-Step Verification
# Based on "Let's Verify Step by Step" (Lightman et al., ICLR 2024)

annotation_task_name: "PRM800K Step-by-Step Verification"
task_dir: "."
data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

annotation_schemes:
  - name: "step_correctness"
    annotation_type: radio
    description: "Rate each reasoning step. Stop and mark 'Incorrect' at the first error you find."
    labels:
      - name: "Correct — this step is logically valid"
        key_value: "1"
      - name: "Neutral — this step doesn't clearly advance or harm"
        key_value: "2"
      - name: "Incorrect — this step contains an error"
        key_value: "3"

  - name: "solution_correctness"
    annotation_type: radio
    description: "Is the final answer correct?"
    labels:
      - name: "Correct — final answer is right"
        key_value: "4"
      - name: "Incorrect — final answer is wrong"
        key_value: "5"

  - name: "error_explanation"
    annotation_type: text
    description: "If you found an error, explain what went wrong in that step."

user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 2
