# ESA: Error Span Annotation for Machine Translation
# Based on "Error Span Annotation: A Balanced Approach for Human Evaluation of Machine Translation" (Kocmi et al., WMT 2024)
# Task: Mark error spans in translations with severity (minor/major), then give a segment-level quality score

annotation_task_name: "ESA: Error Span Annotation for MT"
task_dir: "."

# Data configuration
data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

# Output
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

# Annotation schemes
annotation_schemes:
  # Span annotation for error identification (ESA: mark each error span by severity)
  - name: "error_spans"
    description: "Highlight each span in the translation that contains an error and mark its severity. In ESA, annotators mark spans as minor or major errors (no need to classify the error type)."
    annotation_type: span
    labels:
      - name: "Minor error"
        color: "#ffb74d"
      - name: "Major error"
        color: "#ff5252"

  # Error type classification
  - name: "primary_error_type"
    description: "What is the primary (most severe) error type in this translation?"
    annotation_type: radio
    labels:
      - name: "Accuracy"
        key_value: "1"
      - name: "Fluency"
        key_value: "2"
      - name: "Terminology"
        key_value: "3"
      - name: "Style"
        key_value: "4"
      - name: "No errors found"
        key_value: "0"

  # Severity rating
  - name: "error_severity"
    description: "Rate the overall severity of errors in this translation."
    annotation_type: likert
    size: 5
    min_label: "1 - No errors"
    max_label: "5 - Critical errors"
    labels:
      - "1 - No errors (perfect translation)"
      - "2 - Minor errors (meaning preserved)"
      - "3 - Moderate errors (some meaning lost)"
      - "4 - Major errors (significant meaning loss)"
      - "5 - Critical errors (wrong or incomprehensible)"

  # Overall quality rating
  - name: "overall_quality"
    description: "Rate the overall translation quality."
    annotation_type: radio
    labels:
      - name: "Perfect"
        key_value: "z"
      - name: "Good"
        key_value: "x"
      - name: "Acceptable"
        key_value: "c"
      - name: "Poor"
        key_value: "v"
      - name: "Unacceptable"
        key_value: "b"

# User configuration
user_config:
  allow_all_users: true

# Task assignment
max_annotations_per_user: 100
num_annotators_per_item: 2
