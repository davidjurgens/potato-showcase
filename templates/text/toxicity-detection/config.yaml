# Toxicity Detection Configuration
# Generated by Potato Annotation Showcase

annotation_task_name: "Toxicity Detection"
task_dir: "."

# Data configuration
data_files:
  - data.json
item_properties:
  id_key: "id"
  text_key: "text"

# Output
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

# Annotation schemes
annotation_schemes:
  # Multi-label toxicity categories
  - annotation_type: multiselect
    name: toxicity_labels
    description: "Select ALL toxicity categories that apply to this text"
    labels:
      - name: Toxic
        tooltip: "Rude, disrespectful, or unreasonable content likely to make someone leave a discussion"
        key_value: "1"
      - name: Severe Toxic
        tooltip: "Extremely hateful, aggressive, or disrespectful content"
        key_value: "2"
      - name: Obscene
        tooltip: "Lewd, indecent, or profane language"
        key_value: "3"
      - name: Threat
        tooltip: "Content that expresses intention to inflict harm"
        key_value: "4"
      - name: Insult
        tooltip: "Insulting, inflammatory, or provocative content directed at a person"
        key_value: "5"
      - name: Identity Hate
        tooltip: "Hateful content targeting someone's identity (race, religion, gender, etc.)"
        key_value: "6"

  # Overall severity rating
  - annotation_type: radio
    name: overall_severity
    description: "Rate the overall severity of toxicity"
    labels:
      - name: Not Toxic
        key_value: "q"
      - name: Mildly Toxic
        key_value: "w"
      - name: Moderately Toxic
        key_value: "e"
      - name: Severely Toxic
        key_value: "r"

# User configuration
user_config:
  allow_all_users: true

# Task assignment
max_annotations_per_user: 100
num_annotators_per_item: 3
