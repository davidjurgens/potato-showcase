# Named Entity Recognition Configuration
# Generated by Potato Annotation Showcase

annotation_task_name: "Named Entity Recognition"
task_dir: "."

# Data configuration
data_files:
  - data.json
item_properties:
  id_key: "id"
  text_key: "text"

# Output
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

# Annotation scheme
annotation_schemes:
  - annotation_type: span
    name: entities
    description: "Highlight named entities in the text and select their type"
    labels:
      - name: PERSON
        tooltip: "Names of people (e.g., 'John Smith', 'Dr. Johnson')"
        color: "#3b82f6"
      - name: ORGANIZATION
        tooltip: "Companies, institutions, agencies (e.g., 'Google', 'United Nations')"
        color: "#10b981"
      - name: LOCATION
        tooltip: "Places, cities, countries (e.g., 'New York', 'France')"
        color: "#f59e0b"
      - name: DATE
        tooltip: "Dates and time expressions (e.g., 'January 2024', 'next Monday')"
        color: "#8b5cf6"
      - name: MISC
        tooltip: "Other named entities that don't fit the above categories"
        color: "#6b7280"

# User configuration
user_config:
  allow_all_users: true

# Task assignment
max_annotations_per_user: 50
num_annotators_per_item: 2
