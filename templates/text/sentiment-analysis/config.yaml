# Sentiment Analysis Configuration
# Generated by Potato Annotation Showcase

annotation_task_name: "Sentiment Analysis"
task_dir: "."

# Data configuration
data_files:
  - data.json
item_properties:
  id_key: "id"
  text_key: "text"

# Output
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

# Annotation scheme
annotation_schemes:
  - annotation_type: radio
    name: sentiment
    description: "What is the sentiment expressed in this text?"
    labels:
      - name: Positive
        tooltip: "The text expresses happiness, satisfaction, approval, or other positive emotions"
        key_value: "1"
      - name: Negative
        tooltip: "The text expresses sadness, anger, frustration, disappointment, or other negative emotions"
        key_value: "2"
      - name: Neutral
        tooltip: "The text does not express strong positive or negative sentiment, or is purely factual"
        key_value: "3"

# User configuration
user_config:
  allow_all_users: true

# Task assignment
max_annotations_per_user: 100
num_annotators_per_item: 1
