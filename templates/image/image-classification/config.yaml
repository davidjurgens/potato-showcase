annotation_task_name: "Image Classification"
task_dir: "."
item_properties:
  id_key: "id"
  text_key: "image_url"
  image_key: "image_url"
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

# Server configuration
server:
  port: 8000

# Data configuration
data_files:
  - "sample-data.json"

# Annotation schemes
annotation_schemes:
  # Primary category (single choice)
  - annotation_type: radio
    name: primary_category
    description: "What is the main subject of this image?"
    labels:
      - name: Person/People
        key_value: "1"
      - name: Animal
        key_value: "2"
      - name: Vehicle
        key_value: "3"
      - name: Building/Architecture
        key_value: "4"
      - name: Nature/Landscape
        key_value: "5"
      - name: Food
        key_value: "6"
      - name: Object/Product
        key_value: "7"
      - name: Text/Document
        key_value: "8"
      - name: Other
        key_value: "9"

  # Additional tags (multi-label)
  - annotation_type: multiselect
    name: tags
    description: "Select all applicable tags"
    labels:
      - Indoor
      - Outdoor
      - Daytime
      - Nighttime
      - Close-up
      - Wide shot
      - Multiple subjects
      - Text visible
      - Watermark present

  # Scene type
  - annotation_type: radio
    name: scene_type
    description: "What type of scene is this?"
    labels:
      - Natural
      - Urban
      - Studio/Staged
      - Screenshot
      - Artwork/Illustration
      - Mixed/Unclear

  # Image quality assessment
  - annotation_type: likert
    name: image_quality
    description: "Rate the overall image quality"
    size: 5
    min_label: "Very poor"
    max_label: "Excellent"

  # Usability for training
  - annotation_type: radio
    name: usable_for_training
    description: "Is this image suitable for model training?"
    labels:
      - Yes - High quality
      - Yes - Acceptable
      - No - Quality issues
      - No - Content issues
      - Unsure

  # Quality issues (if any)
  - annotation_type: multiselect
    name: quality_issues
    description: "Select any quality issues (if applicable)"
    labels:
      - Blurry
      - Too dark
      - Too bright
      - Low resolution
      - Cropped badly
      - Watermark obstructs content
      - NSFW content
      - Duplicate
      - No issues

# User settings
user_config:
  allow_all_users: true
max_annotations_per_user: 200
num_annotators_per_item: 2
