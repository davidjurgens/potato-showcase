annotation_task_name: "LLM Response Preference Collection"
task_dir: "."
item_properties:
  id_key: "id"
  text_key: "text"
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

# Server configuration
server:
  port: 8000

# Data configuration
data_files:
  - path: data/response_pairs.json
    item_a_field: response_a
    item_b_field: response_b
    context_field: prompt

# Annotation schemes
annotation_schemes:
  # Main preference rating
  - annotation_type: pairwise
    name: overall_preference
    description: "Overall, which response is better?"
    mode: "scale"
    scale:
      min: -2
      max: 2
      step: 1
      labels:
        min: "A is much better"
        max: "B is much better"
        center: "About equal"
    randomize_order: true

  # Individual aspect ratings
  - annotation_type: pairwise
    name: helpfulness
    description: "Which response is more helpful?"
    allow_tie: true
    tie_label: "Equal"
    randomize_order: true

  - annotation_type: pairwise
    name: accuracy
    description: "Which response is more accurate?"
    allow_tie: true
    tie_label: "Equal"
    randomize_order: true

  - annotation_type: pairwise
    name: safety
    description: "Which response is safer/less harmful?"
    allow_tie: true
    tie_label: "Equal"
    randomize_order: true

  # Reasons for preference
  - annotation_type: multiselect
    name: preference_reasons
    description: "What factors influenced your choice? (Select all that apply)"
    labels:
      - More accurate information
      - Better explained
      - More concise
      - More thorough
      - Better formatting
      - More appropriate tone
      - Safer/less harmful

  # Free-text justification
  - annotation_type: text
    name: justification
    description: "Briefly explain your preference"
    multiline: true
    required: false
    placeholder: "Why did you prefer one response over the other?"

# User settings
user_config:
  allow_all_users: true
max_annotations_per_user: 50
num_annotators_per_item: 3
