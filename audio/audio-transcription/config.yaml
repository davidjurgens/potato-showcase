annotation_task_name: "Audio Transcription Review"
task_dir: "."
item_properties:
  id_key: "id"
  text_key: "text"
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

# Server configuration
server:
  port: 8000

# Data configuration
data_files:
  - path: sample-data.json
    audio_field: audio_url
    text_field: transcript

# Annotation schemes
annotation_schemes:
  # Overall quality assessment
  - annotation_type: radio
    name: overall_accuracy
    description: "How accurate is the transcript overall?"
    labels:
      - name: Perfect (no errors)
        key_value: "1"
      - name: Minor errors (1-2 words)
        key_value: "2"
      - name: Moderate errors (3-5 words)
        key_value: "3"
      - name: Major errors (>5 words or meaning changed)
        key_value: "4"
      - name: Completely wrong
        key_value: "5"

  # Error types observed
  - annotation_type: multiselect
    name: error_types
    description: "What types of errors are present? (Select all that apply)"
    labels:
      - Word substitution
      - Missing words
      - Extra words inserted
      - Word order errors
      - Punctuation errors
      - Speaker confusion
      - Background noise interference
      - No errors

  # Corrected transcript
  - annotation_type: text
    name: corrected_transcript
    description: "Provide the corrected transcript (if needed)"
    multiline: true
    required: false
    placeholder: "Type the corrected version here..."

  # Audio quality rating
  - annotation_type: likert
    name: audio_quality
    description: "Rate the audio quality"
    size: 5
    min_label: "Very poor"
    max_label: "Excellent"
    sequential_key_binding: true

  # Difficulty rating
  - annotation_type: likert
    name: difficulty
    description: "How difficult was this to transcribe?"
    size: 5
    min_label: "Very easy"
    max_label: "Very difficult"

  # Additional notes
  - annotation_type: text
    name: notes
    description: "Any additional notes? (Optional)"
    multiline: true
    required: false

max_annotations_per_user: 100
