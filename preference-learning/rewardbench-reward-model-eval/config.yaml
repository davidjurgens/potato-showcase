# RewardBench: Reward Model Evaluation via Pairwise Preference
# Based on "RewardBench: Evaluating Reward Models for Language Modeling" (Lambert et al., Findings NAACL 2025)
# Task: Pairwise preference annotation across chat, safety, reasoning, and coding categories

annotation_task_name: "RewardBench Reward Model Evaluation"
task_dir: "."

# Data configuration
data_files:
  - sample-data.json
item_properties:
  id_key: "id"
  text_key: "text"

# Output
output_annotation_dir: "annotation_output/"
export_annotation_format: "jsonl"

# Annotation schemes
annotation_schemes:
  # Pairwise preference
  - name: "preference"
    description: "Which response is better? Select your preference."
    annotation_type: pairwise
    labels:
      - "Chosen (A) is better"
      - "Rejected (B) is better"
      - "Tie - both equally good"
      - "Tie - both equally bad"

  # Confidence
  - name: "confidence"
    description: "How confident are you in your preference judgment?"
    annotation_type: radio
    labels:
      - name: "Very confident"
        key_value: "1"
      - name: "Somewhat confident"
        key_value: "2"
      - name: "Not confident"
        key_value: "3"

  # Difficulty
  - name: "difficulty"
    description: "How difficult was this comparison?"
    annotation_type: radio
    labels:
      - name: "Easy - clear difference"
        key_value: "z"
      - name: "Medium - required thought"
        key_value: "x"
      - name: "Hard - very close"
        key_value: "c"

# User configuration
user_config:
  allow_all_users: true

# Task assignment
max_annotations_per_user: 200
num_annotators_per_item: 2
